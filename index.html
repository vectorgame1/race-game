<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Гонки 🏎️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            height: 100%;
            font-family: -apple-system, 'Segoe UI', sans-serif;
            padding: 6px;
            overflow: hidden;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            touch-action: none;
        }
        .game-wrap {
            background: #16213e;
            padding: 8px;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
            width: 100%;
            max-width: 420px;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            color: white;
            margin-bottom: 6px;
            font-size: 12px;
            gap: 4px;
        }
        .hud span { font-weight: bold; color: #4ecca3; }
        .hud .level-tag { color: #f9a826; }
        .hud .wallet-tag { color: #ffd700; }
        canvas {
            background: #2d2d44;
            border-radius: 10px;
            display: block;
            touch-action: none;
            width: 100%;
            height: auto;
            max-height: calc(100vh - 280px);
            object-fit: contain;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            gap: 6px;
        }
        .btn {
            flex: 1;
            padding: 10px;
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        .btn:hover { background: #3db892; }
        .btn:active { transform: scale(0.97); }
        .abilities {
            display: flex;
            gap: 4px;
            margin-top: 6px;
        }
        .ability-btn {
            flex: 1;
            padding: 6px 2px;
            background: #2d2d44;
            color: white;
            border: 2px solid #444;
            border-radius: 8px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
        }
        .ability-btn .icon { font-size: 15px; }
        .ability-btn .key {
            font-size: 8px;
            color: #888;
            background: #1a1a2e;
            padding: 1px 3px;
            border-radius: 3px;
        }
        .ability-btn:hover:not(:disabled) {
            border-color: #4ecca3;
            background: #3a3a55;
        }
        .ability-btn:active:not(:disabled) {
            transform: scale(0.95);
        }
        .ability-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .ability-btn.active {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }
        .hint {
            color: #888;
            text-align: center;
            margin-top: 4px;
            font-size: 10px;
        }
        .sound-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255,255,255,0.1);
            color: white;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 5px 9px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 5;
        }
        .sound-btn:hover { background: rgba(255,255,255,0.2); }
        .sound-btn.on {
            background: #4ecca3;
            color: #1a1a2e;
            border-color: #4ecca3;
        }
        .screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(22, 33, 62, 0.97);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 14px;
            z-index: 10;
            overflow-y: auto;
        }
        .screen.hidden { display: none; }
        .screen h2 {
            color: white;
            margin-bottom: 10px;
            font-size: 18px;
            text-align: center;
        }
        .screen .wallet {
            color: #ffd700;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .menu-btn {
            width: 100%;
            max-width: 280px;
            padding: 10px 14px;
            margin-bottom: 6px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .menu-btn.easy   { background: #4ecca3; }
        .menu-btn.medium { background: #f9a826; }
        .menu-btn.hard   { background: #e94560; }
        .menu-btn.shop   { background: #9b59b6; }
        .menu-btn.back   { background: #555; }
        .menu-btn.teleport {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            margin-top: 8px;
        }
        .menu-btn.teleport.active {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
        }
        .menu-btn small { font-weight: normal; font-size: 11px; opacity: 0.9; }
        .section-title {
            color: #f9a826;
            font-size: 13px;
            font-weight: bold;
            margin: 10px 0 6px;
            align-self: flex-start;
            max-width: 320px;
            width: 100%;
        }
        .shop-item {
            width: 100%;
            max-width: 320px;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 8px 10px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            border: 2px solid transparent;
        }
        .shop-item.owned {
            border-color: #4ecca3;
            background: rgba(78, 204, 163, 0.15);
        }
        .shop-item.equipped {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.15);
        }
        .shop-item .info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }
        .shop-item .car-emoji {
            font-size: 26px;
            flex-shrink: 0;
        }
        .shop-item .name {
            font-weight: bold;
            font-size: 13px;
        }
        .shop-item .desc {
            font-size: 10px;
            color: #aaa;
        }
        .shop-item .buy-btn {
            padding: 6px 10px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            background: #4ecca3;
            color: #1a1a2e;
            flex-shrink: 0;
        }
        .shop-item .buy-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        .shop-item .buy-btn.equip {
            background: #ffd700;
            color: #1a1a2e;
        }
        .bonus-row {
            display: flex;
            gap: 6px;
            max-width: 320px;
            width: 100%;
            margin-bottom: 6px;
        }
        .bonus-item {
            flex: 1;
            background: rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
            color: white;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .bonus-item:hover {
            background: rgba(255,255,255,0.15);
        }
        .bonus-item.active {
            border-color: #4ecca3;
            background: rgba(78, 204, 163, 0.2);
        }
        .bonus-item .icon { font-size: 18px; }
        .bonus-item .title { font-size: 10px; font-weight: bold; margin-top: 2px; }
        .bonus-item .price { font-size: 9px; color: #ffd700; margin-top: 2px; }
    </style>
</head>
<body>
    <div class="game-wrap">
        <button class="sound-btn" id="soundBtn">🔇 Звук</button>

        <div class="hud">
            <div>Очки: <span id="score">0</span></div>
            <div>🪙 <span class="wallet-tag" id="wallet">0</span></div>
            <div>Ур.: <span class="level-tag" id="levelName">—</span></div>
        </div>
        <canvas id="game" width="360" height="540"></canvas>
        <div class="controls">
            <button class="btn" id="leftBtn">◀ Влево</button>
            <button class="btn" id="rightBtn">Вправо ▶</button>
        </div>

        <div class="abilities">
            <button class="ability-btn" id="abilityBoost" disabled>
                <span class="icon">⚡</span>
                <span>Ускор.</span>
                <span class="key">У</span>
            </button>
            <button class="ability-btn" id="abilityShield" disabled>
                <span class="icon">🛡️</span>
                <span>Щит</span>
                <span class="key">Щ</span>
            </button>
            <button class="ability-btn" id="abilityTeleport" disabled>
                <span class="icon">🌀</span>
                <span>Телеп.</span>
                <span class="key">Т</span>
            </button>
            <button class="ability-btn" id="abilityPause">
                <span class="icon">⏸️</span>
                <span>Пауза</span>
                <span class="key">П</span>
            </button>
        </div>

        <div class="hint">← → движение | У Т Щ П — способности</div>

        <div class="screen" id="mainMenu">
            <h2>🏁 Гонки</h2>
            <div class="wallet">🪙 Копилка: <span id="walletMenu">0</span></div>
            <div class="section-title">🗺️ Карта</div>
            <div class="bonus-row" id="mapRow"></div>
            <div class="section-title">🎯 Уровень</div>
            <button class="menu-btn easy" data-level="easy">
                <span>🟢 Лёгкий</span>
                <small>медленно</small>
            </button>
            <button class="menu-btn medium" data-level="medium">
                <span>🟡 Средний</span>
                <small>как раньше</small>
            </button>
            <button class="menu-btn hard" data-level="hard">
                <span>🔴 Сложный</span>
                <small>хардкор</small>
            </button>
            <button class="menu-btn teleport" id="teleportBtn">
                <span>⚡ Телепорт</span>
                <small id="teleportStatus">50 🪙</small>
            </button>
            <button class="menu-btn shop" id="openShopBtn">
                <span>🛒 Магазин</span>
                <small>купить машину</small>
            </button>
        </div>

        <div class="screen hidden" id="shopMenu">
            <h2>🛒 Магазин</h2>
            <div class="wallet">🪙 Копилка: <span id="walletShop">0</span></div>
            <div class="section-title">🚗 Машины (каждая со своим прикольчиком)</div>
            <div id="carsList"></div>
            <div class="section-title">🎁 Бонусы на заезд</div>
            <div class="bonus-row">
                <div class="bonus-item" data-bonus="shield">
                    <div class="icon">🛡️</div>
                    <div class="title">Щит</div>
                    <div class="price">5 🪙</div>
                </div>
                <div class="bonus-item" data-bonus="slow">
                    <div class="icon">⏱️</div>
                    <div class="title">Замедл.</div>
                    <div class="price">3 🪙</div>
                </div>
                <div class="bonus-item" data-bonus="x2">
                    <div class="icon">💰</div>
                    <div class="title">x2 очки</div>
                    <div class="price">5 🪙</div>
                </div>
            </div>
            <button class="menu-btn back" id="closeShopBtn" style="margin-top: 10px;">
                <span>← Назад</span>
            </button>
        </div>

        <!-- Кнопки после аварии -->
        <div class="screen hidden" id="gameOverScreen">
            <h2>💥 АВАРИЯ!</h2>
            <div class="wallet" id="gameOverStats"></div>
            <button class="menu-btn easy" id="restartBtn">
                <span>🔄 Заново</span>
                <small>тот же уровень</small>
            </button>
            <button class="menu-btn shop" id="toMenuBtn">
                <span>🏠 В меню</span>
                <small>выбрать другое</small>
            </button>
        </div>
    </div>

    <script>
        // ========== КАРТЫ ==========
        const MAPS = [
            { id: 'city',   name: 'Город',   icon: '🌆', roadColor: '#3a3a55', roadEdge: '#e94560', lineColor: '#ffeb3b', bgColor: '#2d2d44', decorColor: '#4a4a66' },
            { id: 'desert', name: 'Пустыня', icon: '🏜️', roadColor: '#8a6d3b', roadEdge: '#c9a300', lineColor: '#fff59d', bgColor: '#d4a76a', decorColor: '#b8894a' },
            { id: 'night',  name: 'Ночная',  icon: '🌃', roadColor: '#1a1a2e', roadEdge: '#9b59b6', lineColor: '#fff',    bgColor: '#0a0a1a', decorColor: '#1f1f3a' },
            { id: 'forest', name: 'Лес',     icon: '🌲', roadColor: '#2d4a2d', roadEdge: '#4ecca3', lineColor: '#fff59d', bgColor: '#1a3a1a', decorColor: '#2a5a2a' },
            { id: 'snow',   name: 'Снег',    icon: '❄️', roadColor: '#c8d4e0', roadEdge: '#4ecca3', lineColor: '#fff',    bgColor: '#e8f0f8', decorColor: '#a8b8c8' }
        ];

        // ========== МАШИНЫ ==========
        const CARS = [
            { id: 'green',     name: 'Обычная',    color: '#4ecca3', price: 0,   icon: '🚗', perk: 'Стандартная',     perkDesc: 'Без способностей' },
            { id: 'police',    name: 'Полиция',    color: '#3498db', price: 30,  icon: '🚓', perk: 'Сирена',          perkDesc: 'Мигалка и звук' },
            { id: 'fire',      name: 'Пожарная',   color: '#e94560', price: 50,  icon: '🚒', perk: 'Сбивает врагов',  perkDesc: 'Уничтожает врага' },
            { id: 'taxi',      name: 'Такси',      color: '#f9a826', price: 40,  icon: '🚕', perk: 'x2 монеты',       perkDesc: 'Монеты вдвое' },
            { id: 'ambulance', name: 'Скорая',     color: '#ffffff', price: 60,  icon: '🚑', perk: 'Спасает 1 раз',   perkDesc: 'Одна авария прощается' },
            { id: 'formula',   name: 'Формула 1',  color: '#ff1744', price: 100, icon: '🏎️', perk: 'Турбо',           perkDesc: 'Быстрее на 20%' },
            { id: 'jeep',      name: 'Джип',       color: '#8b4513', price: 80,  icon: '🚙', perk: 'Неуязвим',        perkDesc: 'Сбивает врагов' },
            { id: 'race',      name: 'Гоночная',   color: '#9b59b6', price: 120, icon: '🏁', perk: 'Дрифт',           perkDesc: 'Резкие повороты' },
            { id: 'minivan',   name: 'Минивэн',    color: '#16a085', price: 70,  icon: '🚐', perk: 'Широкий',         perkDesc: 'Больше, но медленнее' }
        ];

        const BONUS_PRICES = { shield: 5, slow: 3, x2: 5 };
        const TELEPORT_PRICE = 50;

        let wallet = parseInt(localStorage.getItem('raceWallet') || '0');
        let ownedCars = JSON.parse(localStorage.getItem('raceOwnedCars') || '["green"]');
        let equippedCar = localStorage.getItem('raceEquippedCar') || 'green';
        let selectedMap = localStorage.getItem('raceSelectedMap') || 'city';
        let activeBonuses = { shield: false, slow: false, x2: false };
        let teleportActive = false;

        function savePlayer() {
            localStorage.setItem('raceWallet', wallet);
            localStorage.setItem('raceOwnedCars', JSON.stringify(ownedCars));
            localStorage.setItem('raceEquippedCar', equippedCar);
            localStorage.setItem('raceSelectedMap', selectedMap);
        }

        function updateWalletUI() {
            document.getElementById('wallet').textContent = wallet;
            document.getElementById('walletMenu').textContent = wallet;
            document.getElementById('walletShop').textContent = wallet;
        }

        function getCarById(id) { return CARS.find(c => c.id === id) || CARS[0]; }
        function getMapById(id) { return MAPS.find(m => m.id === id) || MAPS[0]; }

        // ========== ЗВУКИ ==========
        let soundEnabled = localStorage.getItem('raceSound') === 'on';
        let audioCtx = null;
        let engineOsc = null;
        let engineGain = null;

        function initAudio() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
            }
        }

        function playTone(freq, duration, type = 'sine', volume = 0.15, startTime = 0) {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(volume, audioCtx.currentTime + startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + startTime);
            osc.stop(audioCtx.currentTime + startTime + duration);
        }

        function soundStart() { playTone(440, 0.12, 'square', 0.12, 0); playTone(554, 0.12, 'square', 0.12, 0.13); playTone(659, 0.2, 'square', 0.12, 0.26); }
        function soundPoint() { playTone(880, 0.08, 'sine', 0.1, 0); }
        function soundCoin() { playTone(1046, 0.06, 'square', 0.1, 0); playTone(1568, 0.12, 'square', 0.1, 0.06); }
        function soundPurchase() { playTone(659, 0.1, 'square', 0.15, 0); playTone(880, 0.1, 'square', 0.15, 0.1); playTone(1318, 0.2, 'square', 0.15, 0.2); }
        function soundSiren() { let t = 0; for (let i = 0; i < 3; i++) { playTone(880, 0.15, 'square', 0.08, t); playTone(660, 0.15, 'square', 0.08, t + 0.15); t += 0.3; } }
        function soundBoost() { playTone(400, 0.1, 'sawtooth', 0.12, 0); playTone(600, 0.1, 'sawtooth', 0.12, 0.1); playTone(900, 0.2, 'sawtooth', 0.12, 0.2); }
        function soundTeleport() { playTone(200, 0.1, 'square', 0.1, 0); playTone(500, 0.1, 'square', 0.1, 0.1); playTone(1200, 0.3, 'square', 0.1, 0.2); }

        function soundCrash() {
            if (!soundEnabled || !audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 0.4;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
            noise.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noise.start();
            playTone(80, 0.5, 'sawtooth', 0.2, 0);
        }

        function startEngine() {
            if (!soundEnabled || !audioCtx || engineOsc) return;
            engineOsc = audioCtx.createOscillator();
            engineGain = audioCtx.createGain();
            engineOsc.type = 'sawtooth';
            engineOsc.frequency.value = 60;
            engineGain.gain.value = 0.03;
            engineOsc.connect(engineGain);
            engineGain.connect(audioCtx.destination);
            engineOsc.start();
        }
        function stopEngine() {
            if (engineOsc) { try { engineOsc.stop(); } catch(e) {} engineOsc = null; engineGain = null; }
        }
        function updateEngine() {
            if (engineOsc && currentLevel) engineOsc.frequency.value = 60 + speed * 15;
        }

        const soundBtn = document.getElementById('soundBtn');
        soundBtn.addEventListener('click', () => {
            initAudio();
            soundEnabled = !soundEnabled;
            localStorage.setItem('raceSound', soundEnabled ? 'on' : 'off');
            updateSoundBtn();
            if (soundEnabled) {
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                soundStart();
                if (currentLevel && !gameOver) startEngine();
            } else {
                stopEngine();
            }
        });
        function updateSoundBtn() {
            if (soundEnabled) { soundBtn.textContent = '🔊 Звук'; soundBtn.classList.add('on'); }
            else { soundBtn.textContent = '🔇 Звук'; soundBtn.classList.remove('on'); }
        }
        updateSoundBtn();

        // ========== ИГРА ==========
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;
        const scoreEl = document.getElementById('score');
        const levelNameEl = document.getElementById('levelName');
        const mainMenuEl = document.getElementById('mainMenu');
        const shopMenuEl = document.getElementById('shopMenu');
        const gameOverScreenEl = document.getElementById('gameOverScreen');

        let best = parseInt(localStorage.getItem('raceBest') || '0');

        const LEVELS = {
            easy:   { name: 'Лёгкий',  startSpeed: 1.5, speedRamp: 0.0008, spawnRate: 130, roadMargin: 30, enemySpeedMin: 0.5, enemySpeedMax: 1.2 },
            medium: { name: 'Средний', startSpeed: 2,   speedRamp: 0.0015, spawnRate: 90,  roadMargin: 40, enemySpeedMin: 1,   enemySpeedMax: 2.5 },
            hard:   { name: 'Сложный', startSpeed: 3,   speedRamp: 0.003,  spawnRate: 55,  roadMargin: 55, enemySpeedMin: 1.5, enemySpeedMax: 3.5 }
        };

        let currentLevel = null;
        let currentMap = null;
        let player, enemies, coins, score, coinsCollected, speed, gameOver, keys, roadOffset, spawnTimer, coinTimer;
        let roadLeft, roadRight;
        let shieldActive = false, slowActive = false, slowTimer = 0, scoreMultiplier = 1;
        let boostActive = false, boostTimer = 0, pauseActive = false;
        let carPerk = '', ambulanceUsed = false;

        const playerW = 44, playerH = 78, enemyW = 44, enemyH = 78, coinR = 12;

        // ========== МАГАЗИН ==========
        function renderShop() {
            const carsList = document.getElementById('carsList');
            carsList.innerHTML = CARS.map(car => {
                const owned = ownedCars.includes(car.id);
                const equipped = equippedCar === car.id;
                let btnHtml = '';
                if (equipped) btnHtml = `<button class="buy-btn equip" disabled>✓</button>`;
                else if (owned) btnHtml = `<button class="buy-btn equip" data-equip="${car.id}">Выбрать</button>`;
                else {
                    const canBuy = wallet >= car.price;
                    btnHtml = `<button class="buy-btn" data-buy="${car.id}" ${canBuy ? '' : 'disabled'}>${car.price} 🪙</button>`;
                }
                return `
                    <div class="shop-item ${equipped ? 'equipped' : (owned ? 'owned' : '')}">
                        <div class="info">
                            <div class="car-emoji">${car.icon}</div>
                            <div>
                                <div class="name">${car.name}</div>
                                <div class="desc">${car.perk}: ${car.perkDesc}</div>
                            </div>
                        </div>
                        ${btnHtml}
                    </div>`;
            }).join('');
            document.querySelectorAll('.bonus-item[data-bonus]').forEach(el => {
                el.classList.toggle('active', activeBonuses[el.dataset.bonus]);
            });
        }

        function renderMaps() {
            const mapRow = document.getElementById('mapRow');
            mapRow.innerHTML = MAPS.map(map => `
                <div class="bonus-item ${selectedMap === map.id ? 'active' : ''}" data-map="${map.id}">
                    <div class="icon">${map.icon}</div>
                    <div class="title">${map.name}</div>
                </div>`).join('');
            mapRow.querySelectorAll('.bonus-item').forEach(el => {
                el.addEventListener('click', () => {
                    selectedMap = el.dataset.map;
                    savePlayer();
                    renderMaps();
                    soundPurchase();
                });
            });
        }

        document.getElementById('carsList').addEventListener('click', (e) => {
            const buyId = e.target.dataset.buy;
            const equipId = e.target.dataset.equip;
            if (buyId) {
                const car = getCarById(buyId);
                if (wallet >= car.price && !ownedCars.includes(car.id)) {
                    wallet -= car.price;
                    ownedCars.push(car.id);
                    equippedCar = car.id;
                    savePlayer(); updateWalletUI(); soundPurchase(); renderShop();
                }
            }
            if (equipId) {
                equippedCar = equipId;
                savePlayer(); soundPurchase(); renderShop();
            }
        });

        document.querySelectorAll('.bonus-item[data-bonus]').forEach(el => {
            el.addEventListener('click', () => {
                const bonus = el.dataset.bonus;
                const price = BONUS_PRICES[bonus];
                if (activeBonuses[bonus]) {
                    wallet += price; activeBonuses[bonus] = false;
                    savePlayer(); updateWalletUI(); renderShop();
                    return;
                }
                if (wallet >= price) {
                    wallet -= price; activeBonuses[bonus] = true;
                    savePlayer(); updateWalletUI(); soundPurchase(); renderShop();
                }
            });
        });

        document.getElementById('teleportBtn').addEventListener('click', () => {
            if (teleportActive) {
                wallet += TELEPORT_PRICE; teleportActive = false;
                savePlayer(); updateWalletUI(); updateTeleportBtn();
                return;
            }
            if (wallet >= TELEPORT_PRICE) {
                wallet -= TELEPORT_PRICE; teleportActive = true;
                savePlayer(); updateWalletUI(); updateTeleportBtn(); soundPurchase();
            }
        });

        function updateTeleportBtn() {
            const btn = document.getElementById('teleportBtn');
            const status = document.getElementById('teleportStatus');
            if (teleportActive) { btn.classList.add('active'); status.textContent = 'Активен! Старт с 500'; }
            else { btn.classList.remove('active'); status.textContent = TELEPORT_PRICE + ' 🪙'; }
        }

        document.getElementById('openShopBtn').addEventListener('click', () => {
            stopEngine();
            mainMenuEl.classList.add('hidden');
            shopMenuEl.classList.remove('hidden');
            renderShop();
        });
        document.getElementById('closeShopBtn').addEventListener('click', () => {
            mainMenuEl.classList.remove('hidden');
            shopMenuEl.classList.add('hidden');
        });
                // ========== УПРАВЛЕНИЕ ИГРОЙ ==========
        function startGame(levelKey) {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            hideGameOver();

            currentLevel = LEVELS[levelKey];
            currentMap = getMapById(selectedMap);
            levelNameEl.textContent = currentLevel.name;

            const roadMargin = teleportActive ? currentLevel.roadMargin + 10 : currentLevel.roadMargin;
            roadLeft = roadMargin;
            roadRight = W - roadMargin;

            player = { x: W / 2 - playerW / 2, y: H - playerH - 20 };
            enemies = [];
            coins = [];
            score = teleportActive ? 500 : 0;
            coinsCollected = 0;
            speed = teleportActive ? currentLevel.startSpeed * 1.5 : currentLevel.startSpeed;
            gameOver = false;
            pauseActive = false;
            keys = { left: false, right: false };
            roadOffset = 0;
            spawnTimer = 0;
            coinTimer = 60;
            scoreEl.textContent = Math.floor(score);

            shieldActive = activeBonuses.shield;
            slowActive = activeBonuses.slow;
            slowTimer = slowActive ? 600 : 0;
            scoreMultiplier = activeBonuses.x2 ? 2 : 1;
            boostActive = false;
            boostTimer = 0;
            ambulanceUsed = false;

            const car = getCarById(equippedCar);
            carPerk = car.perk;

            if (car.id === 'formula') speed *= 1.2;
            if (car.id === 'minivan') speed *= 0.85;

            mainMenuEl.classList.add('hidden');
            shopMenuEl.classList.add('hidden');

            updateAbilities();

            if (soundEnabled) {
                stopEngine();
                soundStart();
                if (car.id === 'police') setTimeout(soundSiren, 600);
                setTimeout(() => startEngine(), 500);
            }
        }

        function showMainMenu() {
            stopEngine();
            mainMenuEl.classList.remove('hidden');
            shopMenuEl.classList.add('hidden');
            levelNameEl.textContent = '—';
            ctx.fillStyle = '#2d2d44';
            ctx.fillRect(0, 0, W, H);
            renderMaps();
            updateTeleportBtn();
        }

        function showGameOver() {
            const stats = document.getElementById('gameOverStats');
            stats.innerHTML = `Очки: <strong>${Math.floor(score)}</strong> | 🪙 Собрано: <strong>${coinsCollected}</strong>`;
            gameOverScreenEl.classList.remove('hidden');
        }

        function hideGameOver() {
            gameOverScreenEl.classList.add('hidden');
        }

        // ========== СПОСОБНОСТИ ==========
        function updateAbilities() {
            const boostBtn = document.getElementById('abilityBoost');
            const shieldBtn = document.getElementById('abilityShield');
            const teleportBtn = document.getElementById('abilityTeleport');
            const car = getCarById(equippedCar);

            boostBtn.disabled = !(car.id === 'formula' || car.id === 'race');
            shieldBtn.disabled = !(activeBonuses.shield || shieldActive);
            teleportBtn.disabled = !teleportActive;

            boostBtn.classList.toggle('active', boostActive);
            shieldBtn.classList.toggle('active', shieldActive);
        }

        function activateBoost() {
            if (boostActive || gameOver || !currentLevel) return;
            const car = getCarById(equippedCar);
            if (car.id !== 'formula' && car.id !== 'race') return;
            boostActive = true;
            boostTimer = 180;
            soundBoost();
            updateAbilities();
        }

        function activateShield() {
            if (shieldActive || gameOver || !currentLevel) return;
            shieldActive = true;
            soundPurchase();
            updateAbilities();
        }

        function activateTeleport() {
            if (!teleportActive || gameOver || !currentLevel) return;
            enemies = [];
            coins.forEach(c => c.y += 200);
            soundTeleport();
            teleportActive = false;
            updateTeleportBtn();
            updateAbilities();
        }

        function togglePause() {
            if (gameOver || !currentLevel) return;
            pauseActive = !pauseActive;
            const pauseBtn = document.getElementById('abilityPause');
            if (pauseActive) {
                pauseBtn.classList.add('active');
                stopEngine();
            } else {
                pauseBtn.classList.remove('active');
                if (soundEnabled) startEngine();
            }
        }

        document.getElementById('abilityBoost').addEventListener('click', activateBoost);
        document.getElementById('abilityShield').addEventListener('click', activateShield);
        document.getElementById('abilityTeleport').addEventListener('click', activateTeleport);
        document.getElementById('abilityPause').addEventListener('click', togglePause);

        // Кнопки после аварии
        document.getElementById('restartBtn').addEventListener('click', () => {
            hideGameOver();
            startGame(Object.keys(LEVELS).find(k => LEVELS[k] === currentLevel));
        });
        document.getElementById('toMenuBtn').addEventListener('click', () => {
            hideGameOver();
            showMainMenu();
        });

        // ========== СПАВН ==========
        function spawnEnemy() {
            const x = roadLeft + Math.random() * (roadRight - roadLeft - enemyW);
            const colors = ['#e94560', '#f9a826', '#9b59b6', '#3498db', '#e67e22'];
            const types = ['car', 'car', 'car', 'truck', 'moto'];
            enemies.push({
                x: x,
                y: -enemyH,
                color: colors[Math.floor(Math.random() * colors.length)],
                speed: currentLevel.enemySpeedMin + Math.random() * (currentLevel.enemySpeedMax - currentLevel.enemySpeedMin),
                type: types[Math.floor(Math.random() * types.length)]
            });
        }

        function spawnCoin() {
            const x = roadLeft + coinR + Math.random() * (roadRight - roadLeft - coinR * 2);
            coins.push({ x: x, y: -coinR * 2, phase: Math.random() * Math.PI * 2 });
        }

        // ========== ОТРИСОВКА ==========
        function roundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function shadeColor(color, percent) {
            if (color.startsWith('rgba') || color === '#ffffff' || color === '#fff') return color;
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.max(0, Math.min(255, (num >> 16) + amt));
            const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
            const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
            return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }

        function drawCar(x, y, w, h, color, isPlayer) {
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            roundRect(x + 3, y + 4, w, h, 8); ctx.fill();

            ctx.fillStyle = '#1a1a1a';
            roundRect(x - 3, y + 12, 6, 16, 3); ctx.fill();
            roundRect(x + w - 3, y + 12, 6, 16, 3); ctx.fill();
            roundRect(x - 3, y + h - 28, 6, 16, 3); ctx.fill();
            roundRect(x + w - 3, y + h - 28, 6, 16, 3); ctx.fill();

            const grad = ctx.createLinearGradient(x, y, x + w, y);
            grad.addColorStop(0, shadeColor(color, -30));
            grad.addColorStop(0.5, color);
            grad.addColorStop(1, shadeColor(color, -30));
            ctx.fillStyle = grad;
            roundRect(x, y, w, h, 10); ctx.fill();

            if (isPlayer && shieldActive) {
                const shieldGrad = ctx.createRadialGradient(x + w/2, y + h/2, 0, x + w/2, y + h/2, w);
                shieldGrad.addColorStop(0, 'rgba(78, 204, 255, 0.05)');
                shieldGrad.addColorStop(0.7, 'rgba(78, 204, 255, 0.25)');
                shieldGrad.addColorStop(1, 'rgba(78, 204, 255, 0)');
                ctx.fillStyle = shieldGrad;
                ctx.beginPath();
                ctx.arc(x + w/2, y + h/2, w, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            roundRect(x + 4, y + 3, w - 8, 10, 5); ctx.fill();

            ctx.fillStyle = 'rgba(120,200,255,0.85)';
            roundRect(x + 8, y + 12, w - 16, 14, 4); ctx.fill();
            ctx.fillStyle = 'rgba(120,200,255,0.6)';
            roundRect(x + 8, y + h - 24, w - 16, 12, 4); ctx.fill();

            ctx.fillStyle = isPlayer ? '#fff59d' : '#ff5252';
            roundRect(x + 5, isPlayer ? y + 4 : y + h - 8, 8, 5, 2); ctx.fill();
            roundRect(x + w - 13, isPlayer ? y + 4 : y + h - 8, 8, 5, 2); ctx.fill();

            if (isPlayer && carPerk === 'Сирена') {
                const flash = Math.floor(Date.now() / 200) % 2;
                ctx.fillStyle = flash === 0 ? '#ff1744' : '#2979ff';
                roundRect(x + w/2 - 6, y - 4, 12, 4, 2);
                ctx.fill();
            }

            if (isPlayer) {
                const glow = ctx.createRadialGradient(x + 9, y + 6, 0, x + 9, y + 6, 15);
                glow.addColorStop(0, 'rgba(255,245,157,0.4)');
                glow.addColorStop(1, 'rgba(255,245,157,0)');
                ctx.fillStyle = glow;
                ctx.fillRect(x - 10, y - 10, 30, 30);
                const glow2 = ctx.createRadialGradient(x + w - 9, y + 6, 0, x + w - 9, y + 6, 15);
                glow2.addColorStop(0, 'rgba(255,245,157,0.4)');
                glow2.addColorStop(1, 'rgba(255,245,157,0)');
                ctx.fillStyle = glow2;
                ctx.fillRect(x + w - 20, y - 10, 30, 30);
            }
        }

        function drawCoin(coin) {
            const wobble = Math.sin(coin.phase) * 0.3 + 1;
            const r = coinR * wobble;
            const glow = ctx.createRadialGradient(coin.x, coin.y, 0, coin.x, coin.y, r * 2);
            glow.addColorStop(0, 'rgba(255,215,0,0.5)');
            glow.addColorStop(1, 'rgba(255,215,0,0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(coin.x, coin.y, r * 2, 0, Math.PI * 2);
            ctx.fill();
            const grad = ctx.createRadialGradient(coin.x - r * 0.3, coin.y - r * 0.3, 0, coin.x, coin.y, r);
            grad.addColorStop(0, '#fff59d');
            grad.addColorStop(0.7, '#ffd700');
            grad.addColorStop(1, '#c9a300');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(coin.x, coin.y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#8a6d00';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.fillStyle = '#8a6d00';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('$', coin.x, coin.y + 1);
        }

        // ========== ОБНОВЛЕНИЕ ==========
        function update() {
            if (gameOver || !currentLevel || pauseActive) return;

            const playerSpeed = 5;
            if (keys.left && player.x > roadLeft) player.x -= playerSpeed;
            if (keys.right && player.x < roadRight - playerW) player.x += playerSpeed;

            roadOffset = (roadOffset + speed) % 60;

            if (slowActive) { slowTimer -= 1; if (slowTimer <= 0) slowActive = false; }
            if (boostActive) { boostTimer -= 1; if (boostTimer <= 0) { boostActive = false; updateAbilities(); } }

            const enemySpeedFactor = slowActive ? 0.4 : 1;
            const boostFactor = boostActive ? 1.8 : 1;

            spawnTimer += speed * boostFactor;
            if (spawnTimer > currentLevel.spawnRate) { spawnEnemy(); spawnTimer = 0; }

            coinTimer -= 1;
            if (coinTimer <= 0) { spawnCoin(); coinTimer = 120 + Math.random() * 120; }

            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].y += (speed + enemies[i].speed) * enemySpeedFactor * boostFactor;

                let ew = enemyW, eh = enemyH;
                if (enemies[i].type === 'truck') { ew = enemyW + 20; eh = enemyH + 20; }
                else if (enemies[i].type === 'moto') { ew = enemyW - 14; eh = enemyH - 10; }

                if (player.x < enemies[i].x + ew && player.x + playerW > enemies[i].x &&
                    player.y < enemies[i].y + eh && player.y + playerH > enemies[i].y) {
                    const car = getCarById(equippedCar);
                    if (shieldActive) {
                        enemies.splice(i, 1); shieldActive = false;
                        playTone(200, 0.3, 'sawtooth', 0.15, 0);
                        updateAbilities();
                        continue;
                    }
                    if (car.id === 'jeep' || car.id === 'fire') {
                        enemies.splice(i, 1); score += 20; soundPoint();
                        continue;
                    }
                    if (car.id === 'ambulance' && !ambulanceUsed) {
                        enemies.splice(i, 1); ambulanceUsed = true;
                        playTone(400, 0.3, 'sine', 0.15, 0);
                        continue;
                    }
                    gameOver = true;
                    stopEngine();
                    soundCrash();
                    if (score > best) { best = Math.floor(score); localStorage.setItem('raceBest', best); }
                    showGameOver();
                }

                if (enemies[i] && enemies[i].y > H) {
                    enemies.splice(i, 1);
                    score += 10 * scoreMultiplier;
                    scoreEl.textContent = Math.floor(score);
                    soundPoint();
                }
            }

            const car = getCarById(equippedCar);
            const coinMultiplier = car.id === 'taxi' ? 2 : 1;
            for (let i = coins.length - 1; i >= 0; i--) {
                coins[i].y += speed * boostFactor;
                coins[i].phase += 0.15;
                const dx = (player.x + playerW / 2) - coins[i].x;
                const dy = (player.y + playerH / 2) - coins[i].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < playerW / 2 + coinR) {
                    coins.splice(i, 1);
                    wallet += coinMultiplier;
                    coinsCollected += 1;
                    savePlayer(); updateWalletUI(); soundCoin();
                    continue;
                }
                if (coins[i].y > H + 30) coins.splice(i, 1);
            }

            speed += currentLevel.speedRamp;
            const oldScore = Math.floor(score / 1000);
            score += speed * 0.05 * scoreMultiplier;
            const newScore = Math.floor(score / 1000);
            if (newScore > oldScore) { wallet += 10; savePlayer(); updateWalletUI(); }
            scoreEl.textContent = Math.floor(score);
            updateEngine();
        }

        function draw() {
            if (!currentLevel || !currentMap) return;

            ctx.fillStyle = currentMap.bgColor;
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = currentMap.decorColor;
            ctx.fillRect(0, 0, roadLeft, H);
            ctx.fillRect(roadRight, 0, W - roadRight, H);
            ctx.fillStyle = currentMap.roadColor;
            ctx.fillRect(roadLeft, 0, roadRight - roadLeft, H);
            ctx.fillStyle = currentMap.lineColor;
            for (let y = -60 + roadOffset; y < H; y += 60) {
                ctx.fillRect(W / 2 - 3, y, 6, 30);
            }
            ctx.fillStyle = currentMap.roadEdge;
            ctx.fillRect(roadLeft - 3, 0, 3, H);
            ctx.fillRect(roadRight, 0, 3, H);

            coins.forEach(drawCoin);
            enemies.forEach(e => {
                let w = enemyW, h = enemyH;
                if (e.type === 'truck') { w = enemyW + 20; h = enemyH + 20; }
                else if (e.type === 'moto') { w = enemyW - 14; h = enemyH - 10; }
                drawCar(e.x, e.y, w, h, e.color, false);
            });

            const myCar = getCarById(equippedCar);
            drawCar(player.x, player.y, playerW, playerH, myCar.color, true);

            if (pauseActive) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 36px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('ПАУЗА', W / 2, H / 2);
                ctx.font = '16px sans-serif';
                ctx.fillStyle = '#aaa';
                ctx.fillText('Нажми П чтобы продолжить', W / 2, H / 2 + 40);
            }

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#e94560';
                ctx.font = 'bold 42px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'alphabetic';
                ctx.fillText('АВАРИЯ!', W / 2, H / 2 - 80);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 26px sans-serif';
                ctx.fillText('Очки: ' + Math.floor(score), W / 2, H / 2 - 30);
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText('🪙 Собрано: ' + coinsCollected, W / 2, H / 2 + 5);
                ctx.fillStyle = '#4ecca3';
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText('💰 В копилке: ' + wallet, W / 2, H / 2 + 35);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // ========== УПРАВЛЕНИЕ ==========
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'arrowleft' || key === 'a' || key === 'ф') keys && (keys.left = true);
            if (key === 'arrowright' || key === 'd' || key === 'в') keys && (keys.right = true);
            if (key === ' ' && gameOver && currentLevel) {
                startGame(Object.keys(LEVELS).find(k => LEVELS[k] === currentLevel));
            }
            if ((key === 'm' || key === 'ь') && gameOver) showMainMenu();
            if (key === 'у' || key === 'e') activateBoost();
            if (key === 'щ' || key === 'o') activateShield();
            if (key === 'т' || key === 'n') activateTeleport();
            if (key === 'п' || key === 'g') togglePause();
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'arrowleft' || key === 'a' || key === 'ф') keys && (keys.left = false);
            if (key === 'arrowright' || key === 'd' || key === 'в') keys && (keys.right = false);
        });

        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        function bindBtn(btn, dir) {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); if (keys) keys[dir] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); if (keys) keys[dir] = false; });
            btn.addEventListener('mousedown', () => keys && (keys[dir] = true));
            btn.addEventListener('mouseup', () => keys && (keys[dir] = false));
            btn.addEventListener('mouseleave', () => keys && (keys[dir] = false));
        }
        bindBtn(leftBtn, 'left');
        bindBtn(rightBtn, 'right');

        document.querySelectorAll('.menu-btn[data-level]').forEach(btn => {
            btn.addEventListener('click', () => startGame(btn.dataset.level));
        });

        // ========== СТАРТ ==========
        updateWalletUI();
        updateTeleportBtn();
        renderMaps();
        showMainMenu();
        loop();
        </script>
