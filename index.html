<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Гонки 🏎️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, 'Segoe UI', sans-serif;
            padding: 20px;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            touch-action: none;
        }
        .game-wrap {
            background: #16213e;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
            width: 400px;
            max-width: 100%;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            color: white;
            margin-bottom: 12px;
            font-size: 14px;
            gap: 6px;
        }
        .hud span { font-weight: bold; color: #4ecca3; }
        .hud .level-tag { color: #f9a826; }
        .hud .wallet-tag { color: #ffd700; }
        canvas {
            background: #2d2d44;
            border-radius: 12px;
            display: block;
            touch-action: none;
            max-width: 100%;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        .btn:hover { background: #3db892; }
        .btn:active { transform: scale(0.97); }
        .hint {
            color: #888;
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
        }

        .sound-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.1);
            color: white;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 5;
        }
        .sound-btn:hover { background: rgba(255,255,255,0.2); }
        .sound-btn.on {
            background: #4ecca3;
            color: #1a1a2e;
            border-color: #4ecca3;
        }

        /* Экраны (меню, магазин, game over) */
        .screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(22, 33, 62, 0.97);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            z-index: 10;
            overflow-y: auto;
        }
        .screen.hidden { display: none; }
        .screen h2 {
            color: white;
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
        }
        .screen .wallet {
            color: #ffd700;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .menu-btn {
            width: 100%;
            max-width: 280px;
            padding: 16px;
            margin-bottom: 10px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .menu-btn.easy   { background: #4ecca3; }
        .menu-btn.medium { background: #f9a826; }
        .menu-btn.hard   { background: #e94560; }
        .menu-btn.shop   { background: #9b59b6; }
        .menu-btn.back   { background: #555; }
        .menu-btn small { font-weight: normal; font-size: 12px; opacity: 0.9; }

        /* Магазин */
        .shop-item {
            width: 100%;
            max-width: 320px;
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            border: 2px solid transparent;
        }
        .shop-item.owned {
            border-color: #4ecca3;
            background: rgba(78, 204, 163, 0.15);
        }
        .shop-item.equipped {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.15);
        }
        .shop-item .info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .shop-item .color-preview {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .shop-item .name {
            font-weight: bold;
            font-size: 15px;
        }
        .shop-item .desc {
            font-size: 12px;
            color: #aaa;
        }
        .shop-item .buy-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            background: #4ecca3;
            color: #1a1a2e;
        }
        .shop-item .buy-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        .shop-item .buy-btn.equip {
            background: #ffd700;
            color: #1a1a2e;
        }

        .section-title {
            color: #f9a826;
            font-size: 16px;
            font-weight: bold;
            margin: 16px 0 10px;
            align-self: flex-start;
            max-width: 320px;
            width: 100%;
        }

        .bonus-row {
            display: flex;
            gap: 8px;
            max-width: 320px;
            width: 100%;
            margin-bottom: 10px;
        }
        .bonus-item {
            flex: 1;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 10px 6px;
            text-align: center;
            color: white;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .bonus-item:hover {
            background: rgba(255,255,255,0.15);
        }
        .bonus-item.active {
            border-color: #4ecca3;
            background: rgba(78, 204, 163, 0.2);
        }
        .bonus-item .icon { font-size: 22px; }
        .bonus-item .title { font-size: 12px; font-weight: bold; margin-top: 4px; }
        .bonus-item .price { font-size: 11px; color: #ffd700; margin-top: 2px; }
    </style>
</head>
<body>
    <div class="game-wrap">
        <button class="sound-btn" id="soundBtn">🔇 Звук выкл</button>

        <div class="hud">
            <div>Очки: <span id="score">0</span></div>
            <div>🪙 <span class="wallet-tag" id="wallet">0</span></div>
            <div>Уровень: <span class="level-tag" id="levelName">—</span></div>
        </div>
        <canvas id="game" width="360" height="540"></canvas>
        <div class="controls">
            <button class="btn" id="leftBtn">◀ Влево</button>
            <button class="btn" id="rightBtn">Вправо ▶</button>
        </div>
        <div class="hint">Управление: ← → или A / D, либо кнопки ниже</div>

        <!-- Главное меню -->
        <div class="screen" id="mainMenu">
            <h2>🏁 Выбери уровень</h2>
            <div class="wallet">🪙 Копилка: <span id="walletMenu">0</span></div>
            <button class="menu-btn easy" data-level="easy">
                <span>🟢 Лёгкий</span>
                <small>медленно</small>
            </button>
            <button class="menu-btn medium" data-level="medium">
                <span>🟡 Средний</span>
                <small>как раньше</small>
            </button>
            <button class="menu-btn hard" data-level="hard">
                <span>🔴 Сложный</span>
                <small>хардкор</small>
            </button>
            <button class="menu-btn shop" id="openShopBtn">
                <span>🛒 Магазин</span>
                <small>купить машину</small>
            </button>
        </div>

        <!-- Магазин -->
        <div class="screen hidden" id="shopMenu">
            <h2>🛒 Магазин</h2>
            <div class="wallet">🪙 Копилка: <span id="walletShop">0</span></div>

            <div class="section-title">🚗 Машины</div>
            <div id="carsList"></div>

            <div class="section-title">🎁 Бонусы на заезд</div>
            <div class="bonus-row">
                <div class="bonus-item" data-bonus="shield">
                    <div class="icon">🛡️</div>
                    <div class="title">Щит</div>
                    <div class="price">5 🪙</div>
                </div>
                <div class="bonus-item" data-bonus="slow">
                    <div class="icon">⏱️</div>
                    <div class="title">Замедление</div>
                    <div class="price">3 🪙</div>
                </div>
                <div class="bonus-item" data-bonus="x2">
                    <div class="icon">💰</div>
                    <div class="title">x2 очки</div>
                    <div class="price">5 🪙</div>
                </div>
            </div>

            <button class="menu-btn back" id="closeShopBtn" style="margin-top: 16px;">
                <span>← Назад</span>
            </button>
        </div>
    </div>

    <script>
        // ========== ДАННЫЕ ИГРОКА ==========
        const CARS = [
            { id: 'green',  name: 'Зелёная',  color: '#4ecca3', price: 0   },
            { id: 'blue',   name: 'Синяя',    color: '#3498db', price: 10  },
            { id: 'yellow', name: 'Жёлтая',   color: '#f9a826', price: 25  },
            { id: 'red',    name: 'Красная',  color: '#e94560', price: 50  },
            { id: 'purple', name: 'Фиолетовая', color: '#9b59b6', price: 100 },
            { id: 'gold',   name: 'Золотая',  color: '#ffd700', price: 200 }
        ];

        const BONUS_PRICES = { shield: 5, slow: 3, x2: 5 };

        let wallet = parseInt(localStorage.getItem('raceWallet') || '0');
        let ownedCars = JSON.parse(localStorage.getItem('raceOwnedCars') || '["green"]');
        let equippedCar = localStorage.getItem('raceEquippedCar') || 'green';
        let activeBonuses = { shield: false, slow: false, x2: false };

        function savePlayer() {
            localStorage.setItem('raceWallet', wallet);
            localStorage.setItem('raceOwnedCars', JSON.stringify(ownedCars));
            localStorage.setItem('raceEquippedCar', equippedCar);
        }

        function updateWalletUI() {
            document.getElementById('wallet').textContent = wallet;
            document.getElementById('walletMenu').textContent = wallet;
            document.getElementById('walletShop').textContent = wallet;
        }

        function getCarById(id) {
            return CARS.find(c => c.id === id) || CARS[0];
        }

        // ========== ЗВУКИ ==========
        let soundEnabled = localStorage.getItem('raceSound') === 'on';
        let audioCtx = null;
        let engineOsc = null;
        let engineGain = null;

        function initAudio() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
            }
        }

        function playTone(freq, duration, type = 'sine', volume = 0.15, startTime = 0) {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(volume, audioCtx.currentTime + startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + startTime);
            osc.stop(audioCtx.currentTime + startTime + duration);
        }

        function soundStart() {
            playTone(440, 0.12, 'square', 0.12, 0);
            playTone(554, 0.12, 'square', 0.12, 0.13);
            playTone(659, 0.2, 'square', 0.12, 0.26);
        }
        function soundPoint() { playTone(880, 0.08, 'sine', 0.1, 0); }
        function soundCoin() {
            playTone(1046, 0.06, 'square', 0.1, 0);
            playTone(1568, 0.12, 'square', 0.1, 0.06);
        }
        function soundPurchase() {
            playTone(659, 0.1, 'square', 0.15, 0);
            playTone(880, 0.1, 'square', 0.15, 0.1);
            playTone(1318, 0.2, 'square', 0.15, 0.2);
        }
        function soundCrash() {
            if (!soundEnabled || !audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 0.4;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
            noise.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noise.start();
            playTone(80, 0.5, 'sawtooth', 0.2, 0);
        }
        function startEngine() {
            if (!soundEnabled || !audioCtx || engineOsc) return;
            engineOsc = audioCtx.createOscillator();
            engineGain = audioCtx.createGain();
            engineOsc.type = 'sawtooth';
            engineOsc.frequency.value = 60;
            engineGain.gain.value = 0.03;
            engineOsc.connect(engineGain);
            engineGain.connect(audioCtx.destination);
            engineOsc.start();
        }
        function stopEngine() {
            if (engineOsc) {
                try { engineOsc.stop(); } catch(e) {}
                engineOsc = null;
                engineGain = null;
            }
        }
        function updateEngine() {
            if (engineOsc && currentLevel) engineOsc.frequency.value = 60 + speed * 15;
        }

        const soundBtn = document.getElementById('soundBtn');
        soundBtn.addEventListener('click', () => {
            initAudio();
            soundEnabled = !soundEnabled;
            localStorage.setItem('raceSound', soundEnabled ? 'on' : 'off');
            updateSoundBtn();
            if (soundEnabled) {
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                soundStart();
                if (currentLevel && !gameOver) startEngine();
            } else {
                stopEngine();
            }
        });
        function updateSoundBtn() {
            if (soundEnabled) {
                soundBtn.textContent = '🔊 Звук вкл';
                soundBtn.classList.add('on');
            } else {
                soundBtn.textContent = '🔇 Звук выкл';
                soundBtn.classList.remove('on');
            }
        }
        updateSoundBtn();

        // ========== ИГРА ==========
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        const scoreEl = document.getElementById('score');
        const levelNameEl = document.getElementById('levelName');
        const mainMenuEl = document.getElementById('mainMenu');
        const shopMenuEl = document.getElementById('shopMenu');

        let best = parseInt(localStorage.getItem('raceBest') || '0');

        const LEVELS = {
            easy:   { name: 'Лёгкий',  startSpeed: 1.5, speedRamp: 0.0005, spawnRate: 130, roadMargin: 30, enemySpeedMin: 0.5, enemySpeedMax: 1.2 },
            medium: { name: 'Средний', startSpeed: 2,   speedRamp: 0.001,  spawnRate: 90,  roadMargin: 40, enemySpeedMin: 1,   enemySpeedMax: 2.5 },
            hard:   { name: 'Сложный', startSpeed: 3,   speedRamp: 0.002,  spawnRate: 55,  roadMargin: 55, enemySpeedMin: 1.5, enemySpeedMax: 3.5 }
        };

        let currentLevel = null;
        let player, enemies, coins, score, coinsCollected, speed, gameOver, keys, roadOffset, spawnTimer, coinTimer;
        let roadLeft, roadRight;
        let shieldActive = false;
        let slowActive = false;
        let slowTimer = 0;
        let scoreMultiplier = 1;

        const playerW = 44;
        const playerH = 78;
        const enemyW = 44;
        const enemyH = 78;
        const coinR = 12;

        function startGame(levelKey) {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            currentLevel = LEVELS[levelKey];
            levelNameEl.textContent = currentLevel.name;

            roadLeft = currentLevel.roadMargin;
            roadRight = W - currentLevel.roadMargin;

            player = { x: W / 2 - playerW / 2, y: H - playerH - 20 };
            enemies = [];
            coins = [];
            score = 0;
            coinsCollected = 0;
            speed = currentLevel.startSpeed;
            gameOver = false;
            keys = { left: false, right: false };
            roadOffset = 0;
            spawnTimer = 0;
            coinTimer = 60;
            scoreEl.textContent = 0;

            // Бонусы
            shieldActive = activeBonuses.shield;
            slowActive = activeBonuses.slow;
            slowTimer = slowActive ? 600 : 0;
            scoreMultiplier = activeBonuses.x2 ? 2 : 1;

            mainMenuEl.classList.add('hidden');
            shopMenuEl.classList.add('hidden');

            if (soundEnabled) {
                stopEngine();
                soundStart();
                setTimeout(() => startEngine(), 500);
            }
        }

        function showMainMenu() {
            stopEngine();
            mainMenuEl.classList.remove('hidden');
            shopMenuEl.classList.add('hidden');
            levelNameEl.textContent = '—';
            ctx.fillStyle = '#2d2d44';
            ctx.fillRect(0, 0, W, H);
        }

        function showShop() {
            stopEngine();
            mainMenuEl.classList.add('hidden');
            shopMenuEl.classList.remove('hidden');
            renderShop();
        }

        // ========== МАГАЗИН ==========
        function renderShop() {
            const carsList = document.getElementById('carsList');
            carsList.innerHTML = CARS.map(car => {
                const owned = ownedCars.includes(car.id);
                const equipped = equippedCar === car.id;
                let btnHtml = '';
                if (equipped) {
                    btnHtml = `<button class="buy-btn equip" disabled>✓ Выбрана</button>`;
                } else if (owned) {
                    btnHtml = `<button class="buy-btn equip" data-equip="${car.id}">Выбрать</button>`;
                } else {
                    const canBuy = wallet >= car.price;
                    btnHtml = `<button class="buy-btn" data-buy="${car.id}" ${canBuy ? '' : 'disabled'}>${car.price} 🪙</button>`;
                }
                return `
                    <div class="shop-item ${equipped ? 'equipped' : (owned ? 'owned' : '')}">
                        <div class="info">
                            <div class="color-preview" style="background:${car.color}"></div>
                            <div>
                                <div class="name">${car.name}</div>
                                <div class="desc">${owned ? 'Куплена' : 'Не куплена'}</div>
                            </div>
                        </div>
                        ${btnHtml}
                    </div>
                `;
            }).join('');

            // Обновляем состояние бонусов
            document.querySelectorAll('.bonus-item').forEach(el => {
                const bonus = el.dataset.bonus;
                if (activeBonuses[bonus]) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        // Клик по кнопкам в магазине
        document.getElementById('carsList').addEventListener('click', (e) => {
            const buyId = e.target.dataset.buy;
            const equipId = e.target.dataset.equip;

            if (buyId) {
                const car = getCarById(buyId);
                if (wallet >= car.price && !ownedCars.includes(car.id)) {
                    wallet -= car.price;
                    ownedCars.push(car.id);
                    equippedCar = car.id;
                    savePlayer();
                    updateWalletUI();
                    soundPurchase();
                    renderShop();
                }
            }

            if (equipId) {
                equippedCar = equipId;
                savePlayer();
                soundPurchase();
                renderShop();
            }
        });

        // Клик по бонусам
        document.querySelectorAll('.bonus-item').forEach(el => {
            el.addEventListener('click', () => {
                const bonus = el.dataset.bonus;
                const price = BONUS_PRICES[bonus];

                if (activeBonuses[bonus]) {
                    // Отмена покупки — возвращаем монеты
                    wallet += price;
                    activeBonuses[bonus] = false;
                    savePlayer();
                    updateWalletUI();
                    renderShop();
                    return;
                }

                if (wallet >= price) {
                    wallet -= price;
                    activeBonuses[bonus] = true;
                    savePlayer();
                    updateWalletUI();
                    soundPurchase();
                    renderShop();
                }
            });
        });

        document.getElementById('openShopBtn').addEventListener('click', showShop);
        document.getElementById('closeShopBtn').addEventListener('click', showMainMenu);

        // ========== ИГРОВАЯ ЛОГИКА ==========
        function spawnEnemy() {
            const x = roadLeft + Math.random() * (roadRight - roadLeft - enemyW);
            const colors = ['#e94560', '#f9a826', '#9b59b6', '#3498db', '#e67e22'];
            enemies.push({
                x: x,
                y: -enemyH,
                color: colors[Math.floor(Math.random() * colors.length)],
                speed: currentLevel.enemySpeedMin +
                       Math.random() * (currentLevel.enemySpeedMax - currentLevel.enemySpeedMin)
            });
        }

        function spawnCoin() {
            const x = roadLeft + coinR + Math.random() * (roadRight - roadLeft - coinR * 2);
            coins.push({
                x: x,
                y: -coinR * 2,
                phase: Math.random() * Math.PI * 2
            });
        }

        function roundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function shadeColor(color, percent) {
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.max(0, Math.min(255, (num >> 16) + amt));
            const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
            const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
            return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }

        function drawCar(x, y, w, h, color, isPlayer) {
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            roundRect(x + 3, y + 4, w, h, 8);
            ctx.fill();

            ctx.fillStyle = '#1a1a1a';
            roundRect(x - 3, y + 12, 6, 16, 3); ctx.fill();
            roundRect(x + w - 3, y + 12, 6, 16, 3); ctx.fill();
            roundRect(x - 3, y + h - 28, 6, 16, 3); ctx.fill();
            roundRect(x + w - 3, y + h - 28, 6, 16, 3); ctx.fill();

            const grad = ctx.createLinearGradient(x, y, x + w, y);
            grad.addColorStop(0, shadeColor(color, -30));
            grad.addColorStop(0.5, color);
            grad.addColorStop(1, shadeColor(color, -30));
            ctx.fillStyle = grad;
            roundRect(x, y, w, h, 10);
            ctx.fill();

            // Щит (если активен)
            if (isPlayer && shieldActive) {
                const shieldGrad = ctx.createRadialGradient(x + w/2, y + h/2, 0, x + w/2, y + h/2, w);
                shieldGrad.addColorStop(0, 'rgba(78, 204, 255, 0.05)');
                shieldGrad.addColorStop(0.7, 'rgba(78, 204, 255, 0.25)');
                shieldGrad.addColorStop(1, 'rgba(78, 204, 255, 0)');
                ctx.fillStyle = shieldGrad;
                ctx.beginPath();
                ctx.arc(x + w/2, y + h/2, w, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            roundRect(x + 4, y + 3, w - 8, 10, 5);
            ctx.fill();

            ctx.fillStyle = 'rgba(120,200,255,0.85)';
            roundRect(x + 8, y + 12, w - 16, 14, 4);
            ctx.fill();
            ctx.fillStyle = 'rgba(120,200,255,0.6)';
            roundRect(x + 8, y + h - 24, w - 16, 12, 4);
            ctx.fill();

            ctx.fillStyle = isPlayer ? '#fff59d' : '#ff5252';
            roundRect(x + 5, isPlayer ? y + 4 : y + h - 8, 8, 5, 2); ctx.fill();
            roundRect(x + w - 13, isPlayer ? y + 4 : y + h - 8, 8, 5, 2); ctx.fill();

            if (isPlayer) {
                const glow = ctx.createRadialGradient(x + 9, y + 6, 0, x + 9, y + 6, 15);
                glow.addColorStop(0, 'rgba(255,245,157,0.4)');
                glow.addColorStop(1, 'rgba(255,245,157,0)');
                ctx.fillStyle = glow;
                ctx.fillRect(x - 10, y - 10, 30, 30);
                const glow2 = ctx.createRadialGradient(x + w - 9, y + 6, 0, x + w - 9, y + 6, 15);
                glow2.addColorStop(0, 'rgba(255,245,157,0.4)');
                glow2.addColorStop(1, 'rgba(255,245,157,0)');
                ctx.fillStyle = glow2;
                ctx.fillRect(x + w - 20, y - 10, 30, 30);
            }
        }

        function drawCoin(coin) {
            const wobble = Math.sin(coin.phase) * 0.3 + 1;
            const r = coinR * wobble;

            const glow = ctx.createRadialGradient(coin.x, coin.y, 0, coin.x, coin.y, r * 2);
            glow.addColorStop(0, 'rgba(255,215,0,0.5)');
            glow.addColorStop(1, 'rgba(255,215,0,0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(coin.x, coin.y, r * 2, 0, Math.PI * 2);
            ctx.fill();

            const grad = ctx.createRadialGradient(coin.x - r * 0.3, coin.y - r * 0.3, 0, coin.x, coin.y, r);
            grad.addColorStop(0, '#fff59d');
            grad.addColorStop(0.7, '#ffd700');
            grad.addColorStop(1, '#c9a300');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(coin.x, coin.y, r, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#8a6d00';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.fillStyle = '#8a6d00';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('$', coin.x, coin.y + 1);
        }

        function update() {
            if (gameOver || !currentLevel) return;

            const playerSpeed = 5;
            if (keys.left && player.x > roadLeft) player.x -= playerSpeed;
            if (keys.right && player.x < roadRight - playerW) player.x += playerSpeed;

            roadOffset = (roadOffset + speed) % 60;

            // Замедление времени
            if (slowActive) {
                slowTimer -= 1;
                if (slowTimer <= 0) {
                    slowActive = false;
                }
            }

            const enemySpeedFactor = slowActive ? 0.4 : 1;

            spawnTimer += speed;
            if (spawnTimer > currentLevel.spawnRate) {
                spawnEnemy();
                spawnTimer = 0;
            }

            coinTimer -= 1;
            if (coinTimer <= 0) {
                spawnCoin();
                coinTimer = 120 + Math.random() * 120;
            }

            // Враги
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].y += (speed + enemies[i].speed) * enemySpeedFactor;

                if (
                    player.x < enemies[i].x + enemyW &&
                    player.x + playerW > enemies[i].x &&
                    player.y < enemies[i].y + enemyH &&
                    player.y + playerH > enemies[i].y
                ) {
                    if (shieldActive) {
                        // Щит спасает — уничтожаем врага
                        enemies.splice(i, 1);
                        shieldActive = false;
                        playTone(200, 0.3, 'sawtooth', 0.15, 0);
                        continue;
                    }
                    gameOver = true;
                    stopEngine();
                    soundCrash();
                    if (score > best) {
                        best = Math.floor(score);
                        localStorage.setItem('raceBest', best);
                    }
                }

                if (enemies[i] && enemies[i].y > H) {
                    enemies.splice(i, 1);
                    score += 10 * scoreMultiplier;
                    scoreEl.textContent = Math.floor(score);
                    soundPoint();
                }
            }

            // Монетки
            for (let i = coins.length - 1; i >= 0; i--) {
                coins[i].y += speed;
                coins[i].phase += 0.15;

                const dx = (player.x + playerW / 2) - coins[i].x;
                const dy = (player.y + playerH / 2) - coins[i].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < playerW / 2 + coinR) {
                    coins.splice(i, 1);
                    wallet += 1;
                    coinsCollected += 1;
                    savePlayer();
                    updateWalletUI();
                    soundCoin();
                    continue;
                }

                if (coins[i].y > H + 30) {
                    coins.splice(i, 1);
                }
            }

            speed += currentLevel.speedRamp;
            const oldScore = Math.floor(score / 1000);
            score += speed * 0.05 * scoreMultiplier;
            const newScore = Math.floor(score / 1000);
            if (newScore > oldScore) {
                wallet += 10;
                savePlayer();
                updateWalletUI();
            }
            scoreEl.textContent = Math.floor(score);
            updateEngine();
        }

        function draw() {
            if (!currentLevel) return;

            ctx.fillStyle = '#2d2d44';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#3a3a55';
            ctx.fillRect(0, 0, roadLeft, H);
            ctx.fillRect(roadRight, 0, W - roadRight, H);

            ctx.fillStyle = '#ffeb3b';
            for (let y = -60 + roadOffset; y < H; y += 60) {
                ctx.fillRect(W / 2 - 3, y, 6, 30);
            }

            ctx.fillStyle = '#e94560';
            ctx.fillRect(roadLeft - 3, 0, 3, H);
            ctx.fillRect(roadRight, 0, 3, H);

            coins.forEach(drawCoin);
            enemies.forEach(e => drawCar(e.x, e.y, enemyW, enemyH, e.color, false));

            const myCar = getCarById(equippedCar);
            drawCar(player.x, player.y, playerW, playerH, myCar.color, true);

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, 0, W, H);

                ctx.fillStyle = '#e94560';
                ctx.font = 'bold 42px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'alphabetic';
                ctx.fillText('АВАРИЯ!', W / 2, H / 2 - 80);

                ctx.fillStyle = 'white';
                ctx.font = 'bold 26px sans-serif';
                ctx.fillText('Очки: ' + Math.floor(score), W / 2, H / 2 - 30);

                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText('🪙 Собрано: ' + coinsCollected, W / 2, H / 2 + 5);

                ctx.fillStyle = '#4ecca3';
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText('💰 В копилке: ' + wallet, W / 2, H / 2 + 35);

                ctx.fillStyle = '#aaa';
                ctx.font = '15px sans-serif';
                ctx.fillText('ПРОБЕЛ — заново', W / 2, H / 2 + 80);
                ctx.fillText('M — в меню', W / 2, H / 2 + 105);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys && (keys.left = true);
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys && (keys.right = true);
            if (e.key === ' ' && gameOver && currentLevel) {
                startGame(Object.keys(LEVELS).find(k => LEVELS[k] === currentLevel));
            }
            if ((e.key === 'm' || e.key === 'M') && gameOver) showMainMenu();
        });
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys && (keys.left = false);
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys && (keys.right = false);
        });

        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        function bindBtn(btn, dir) {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); if (keys) keys[dir] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); if (keys) keys[dir] = false; });
            btn.addEventListener('mousedown', () => keys && (keys[dir] = true));
            btn.addEventListener('mouseup', () => keys && (keys[dir] = false));
            btn.addEventListener('mouseleave', () => keys && (keys[dir] = false));
        }
        bindBtn(leftBtn, 'left');
        bindBtn(rightBtn, 'right');

        document.querySelectorAll('.menu-btn[data-level]').forEach(btn => {
            btn.addEventListener('click', () => startGame(btn.dataset.level));
        });

        updateWalletUI();
        showMainMenu();
        loop();
    </script>
</body>
</html>
