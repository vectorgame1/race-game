<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Гонки 3D 🏎️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            height: 100%;
            width: 100%;
            font-family: -apple-system, 'Segoe UI', sans-serif;
            padding: 4px;
            margin: 0;
            overflow: hidden;
            position: fixed;
            top: 0; left: 0;
            touch-action: none;
        }
        .game-wrap {
            background: #16213e;
            padding: 8px;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
            width: 100%;
            max-width: 480px;
            min-height: 500px;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        body.tg-mode .game-wrap {
            height: 100vh;
            max-height: 100vh;
            min-height: 0;
        }
        body.tg-mode canvas {
            height: 100%;
            flex: 1;
            min-height: 0;
            max-height: none;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            color: white;
            margin-bottom: 6px;
            font-size: 11px;
            gap: 3px;
            flex-shrink: 0;
        }
        .hud span { font-weight: bold; color: #4ecca3; }
        .hud .level-tag { color: #f9a826; }
        .hud .wallet-tag { color: #ffd700; }
        .hud .xp-tag { color: #00d2ff; }
        canvas {
            background: #2d2d44;
            border-radius: 10px;
            display: block;
            touch-action: none;
            width: 100%;
            height: auto;
            max-height: calc(100vh - 250px);
            object-fit: contain;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            gap: 5px;
            flex-shrink: 0;
        }
        .btn {
            flex: 1;
            padding: 10px;
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        .btn:active { transform: scale(0.97); }
        .abilities {
            display: flex;
            gap: 4px;
            margin-top: 5px;
            flex-shrink: 0;
        }
        .ability-btn {
            flex: 1;
            padding: 6px 2px;
            background: #2d2d44;
            color: white;
            border: 2px solid #444;
            border-radius: 8px;
            font-size: 9px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
        }
        .ability-btn .icon { font-size: 14px; }
        .ability-btn .key {
            font-size: 8px;
            color: #888;
            background: #1a1a2e;
            padding: 1px 3px;
            border-radius: 3px;
        }
        .ability-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .ability-btn.active {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }
        .hint {
            color: #888;
            text-align: center;
            margin-top: 3px;
            font-size: 9px;
            flex-shrink: 0;
        }
        .sound-btn {
            position: absolute;
            top: 10px; right: 10px;
            background: rgba(255,255,255,0.1);
            color: white;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 5px 9px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 5;
        }
        .sound-btn.on { background: #4ecca3; color: #1a1a2e; border-color: #4ecca3; }
        .screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #16213e;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 14px;
            z-index: 10;
            overflow-y: auto;
        }
        .screen.hidden { display: none; }
        .screen h2 {
            color: white;
            margin-bottom: 10px;
            font-size: 19px;
            text-align: center;
        }
        .screen .wallet {
            color: #ffd700;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .screen .player-stats {
            color: #00d2ff;
            font-size: 12px;
            margin-bottom: 10px;
            text-align: center;
        }
        .menu-btn {
            width: 100%;
            max-width: 320px;
            padding: 13px 16px;
            margin-bottom: 7px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-btn:hover { transform: translateY(-2px); }
        .menu-btn.easy   { background: #4ecca3; }
        .menu-btn.medium { background: #f9a826; }
        .menu-btn.hard   { background: #e94560; }
        .menu-btn.shop   { background: #9b59b6; }
        .menu-btn.campaign { background: #00d2ff; }
        .menu-btn.achievements { background: #ffd700; color: #1a1a2e; }
        .menu-btn.daily { background: #16a085; }
        .menu-btn.upgrade { background: #e67e22; }
        .menu-btn.back   { background: #555; }
        .menu-btn.teleport {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
        }
        .menu-btn.teleport.active {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
        }
        .menu-btn small { font-weight: normal; font-size: 11px; opacity: 0.9; }
        .section-title {
            color: #f9a826;
            font-size: 14px;
            font-weight: bold;
            margin: 10px 0 6px;
            align-self: flex-start;
            max-width: 360px;
            width: 100%;
        }
        .map-row {
            display: flex;
            gap: 6px;
            max-width: 360px;
            width: 100%;
            margin-bottom: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .map-item {
            width: calc(33.33% - 4px);
            min-width: 88px;
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px 6px;
            text-align: center;
            color: white;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
        }
        .map-item.active {
            border-color: #4ecca3;
            background: rgba(78, 204, 163, 0.2);
        }
        .map-item .icon { font-size: 26px; }
        .map-item .title { font-size: 11px; font-weight: bold; margin-top: 4px; }
        .bonus-row {
            display: flex;
            gap: 6px;
            max-width: 360px;
            width: 100%;
            margin-bottom: 6px;
        }
        .bonus-item {
            flex: 1;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 9px 5px;
            text-align: center;
            color: white;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
        }
        .bonus-item.active {
            border-color: #4ecca3;
            background: rgba(78, 204, 163, 0.2);
        }
        .bonus-item .icon { font-size: 20px; }
        .bonus-item .title { font-size: 11px; font-weight: bold; margin-top: 3px; }
        .bonus-item .price { font-size: 10px; color: #ffd700; margin-top: 2px; }
        .shop-item {
            width: 100%;
            max-width: 360px;
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 11px 13px;
            margin-bottom: 7px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            border: 3px solid transparent;
        }
        .shop-item.owned { border-color: #4ecca3; background: rgba(78, 204, 163, 0.15); }
        .shop-item.equipped { border-color: #ffd700; background: rgba(255, 215, 0, 0.15); }
        .shop-item .info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }
        .shop-item .car-emoji { font-size: 30px; flex-shrink: 0; }
        .shop-item .name { font-weight: bold; font-size: 14px; }
        .shop-item .desc { font-size: 10px; color: #aaa; margin-top: 2px; }
        .shop-item .buy-btn {
            padding: 9px 12px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            background: #4ecca3;
            color: #1a1a2e;
            flex-shrink: 0;
        }
        .shop-item .buy-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
        .shop-item .buy-btn.equip { background: #ffd700; color: #1a1a2e; }
        .achievement-item {
            width: 100%;
            max-width: 360px;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            border: 2px solid transparent;
        }
        .achievement-item.unlocked {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.12);
        }
        .achievement-item .ach-icon { font-size: 26px; flex-shrink: 0; }
        .achievement-item .ach-info { flex: 1; }
        .achievement-item .ach-name { font-weight: bold; font-size: 13px; }
        .achievement-item .ach-desc { font-size: 10px; color: #aaa; margin-top: 2px; }
        .achievement-item .ach-status { font-size: 18px; }
        .campaign-level {
            width: 100%;
            max-width: 360px;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .campaign-level.locked { opacity: 0.5; cursor: not-allowed; }
        .campaign-level.completed { border-color: #4ecca3; background: rgba(78, 204, 163, 0.15); }
        .campaign-level .cl-num { font-size: 22px; font-weight: bold; color: #00d2ff; flex-shrink: 0; }
        .campaign-level .cl-info { flex: 1; }
        .campaign-level .cl-name { font-weight: bold; font-size: 13px; }
        .campaign-level .cl-task { font-size: 10px; color: #aaa; margin-top: 2px; }
        .campaign-level .cl-status { font-size: 18px; }
        .upgrade-item {
            width: 100%;
            max-width: 360px;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 6px;
            color: white;
        }
        .upgrade-item .up-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .upgrade-item .up-name { font-weight: bold; font-size: 13px; }
        .upgrade-item .up-level { font-size: 12px; color: #ffd700; }
        .upgrade-item .up-bar {
            height: 8px;
            background: #1a1a2e;
            border-radius: 4px;
            overflow: hidden;
        }
        .upgrade-item .up-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ecca3, #00d2ff);
            transition: width 0.3s;
        }
        .upgrade-item .up-btn {
            width: 100%;
            margin-top: 6px;
            padding: 8px;
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .upgrade-item .up-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="game-wrap">
        <button class="sound-btn" id="soundBtn">🔇 Звук</button>
        <div class="hud">
            <div>Очки: <span id="score">0</span></div>
            <div>🪙 <span class="wallet-tag" id="wallet">0</span></div>
            <div>⭐ <span class="xp-tag" id="xpDisplay">0</span></div>
            <div>Ур.: <span class="level-tag" id="levelName">—</span></div>
        </div>
        <canvas id="game" width="360" height="540"></canvas>
        <div class="controls">
            <button class="btn" id="leftBtn">◀ Влево</button>
            <button class="btn" id="rightBtn">Вправо ▶</button>
        </div>
        <div class="abilities">
            <button class="ability-btn" id="abilityBoost" disabled>
                <span class="icon">⚡</span><span>Ускор.</span><span class="key">У</span>
            </button>
            <button class="ability-btn" id="abilityShield" disabled>
                <span class="icon">🛡️</span><span>Щит</span><span class="key">Щ</span>
            </button>
            <button class="ability-btn" id="abilityTeleport" disabled>
                <span class="icon">🌀</span><span>Телеп.</span><span class="key">Т</span>
            </button>
            <button class="ability-btn" id="abilityPause">
                <span class="icon">⏸️</span><span>Пауза</span><span class="key">П</span>
            </button>
        </div>
        <div class="hint">← → движение | У Т Щ П — способности</div>

        <div class="screen" id="mainMenu">
            <h2>🏁 Гонки 3D</h2>
            <div class="wallet">🪙 Копилка: <span id="walletMenu">0</span></div>
            <div class="player-stats" id="playerStats"></div>
            <div class="section-title">🗺️ Карта</div>
            <div class="map-row" id="mapRow"></div>
            <div class="section-title">🎯 Быстрая игра</div>
            <button class="menu-btn easy" data-level="easy"><span>🟢 Лёгкий</span><small>медленно</small></button>
            <button class="menu-btn medium" data-level="medium"><span>🟡 Средний</span><small>как раньше</small></button>
            <button class="menu-btn hard" data-level="hard"><span>🔴 Сложный</span><small>хардкор</small></button>
            <button class="menu-btn campaign" id="campaignBtn"><span>🎮 Кампания</span><small>20 уровней</small></button>
            <button class="menu-btn daily" id="dailyBtn"><span>📅 Ежедневные</span><small>задания дня</small></button>
            <button class="menu-btn achievements" id="achievementsBtn"><span>🏆 Достижения</span><small id="achCount">0/15</small></button>
            <button class="menu-btn upgrade" id="upgradeBtn"><span>⚙️ Прокачка</span><small>улучшения</small></button>
            <button class="menu-btn teleport" id="teleportBtn"><span>⚡ Телепорт</span><small id="teleportStatus">50 🪙</small></button>
            <button class="menu-btn shop" id="openShopBtn"><span>🛒 Магазин</span><small>купить машину</small></button>
        </div>

        <div class="screen hidden" id="shopMenu">
            <h2>🛒 Магазин</h2>
            <div class="wallet">🪙 Копилка: <span id="walletShop">0</span></div>
            <div class="section-title">🚗 Машины</div>
            <div id="carsList"></div>
            <div class="section-title">🎁 Бонусы на заезд</div>
            <div class="bonus-row">
                <div class="bonus-item" data-bonus="shield"><div class="icon">🛡️</div><div class="title">Щит</div><div class="price">5 🪙</div></div>
                <div class="bonus-item" data-bonus="slow"><div class="icon">⏱️</div><div class="title">Замедл.</div><div class="price">3 🪙</div></div>
                <div class="bonus-item" data-bonus="x2"><div class="icon">💰</div><div class="title">x2 очки</div><div class="price">5 🪙</div></div>
            </div>
            <button class="menu-btn back" id="closeShopBtn" style="margin-top: 10px;"><span>← Назад</span></button>
        </div>

        <div class="screen hidden" id="campaignMenu">
            <h2>🎮 Кампания</h2>
            <div id="campaignList"></div>
            <button class="menu-btn back" id="closeCampaignBtn" style="margin-top: 10px;"><span>← Назад</span></button>
        </div>

        <div class="screen hidden" id="achievementsMenu">
            <h2>🏆 Достижения</h2>
            <div id="achievementsList"></div>
            <button class="menu-btn back" id="closeAchievementsBtn" style="margin-top: 10px;"><span>← Назад</span></button>
        </div>

        <div class="screen hidden" id="dailyMenu">
            <h2>📅 Ежедневные задания</h2>
            <div id="dailyList"></div>
            <button class="menu-btn back" id="closeDailyBtn" style="margin-top: 10px;"><span>← Назад</span></button>
        </div>

        <div class="screen hidden" id="upgradeMenu">
            <h2>⚙️ Прокачка</h2>
            <div class="wallet">🪙 Копилка: <span id="walletUpgrade">0</span></div>
            <div id="upgradesList"></div>
            <button class="menu-btn back" id="closeUpgradeBtn" style="margin-top: 10px;"><span>← Назад</span></button>
        </div>

        <div class="screen hidden" id="gameOverScreen">
            <h2>💥 АВАРИЯ!</h2>
            <div class="wallet" id="gameOverStats"></div>
            <button class="menu-btn easy" id="restartBtn"><span>🔄 Заново</span><small>тот же уровень</small></button>
            <button class="menu-btn shop" id="toMenuBtn"><span>🏠 В меню</span><small>выбрать другое</small></button>
        </div>
    </div>
        <script>
        // ========== КАРТЫ ==========
        const MAPS = [
            { id: 'city',   name: 'Город',   icon: '🌆', skyTop: '#1a1a3e', skyBot: '#4a4a8a', roadColor: '#3a3a55', roadEdge: '#e94560', lineColor: '#ffeb3b', bgColor: '#2d2d44', decorColor: '#4a4a66' },
            { id: 'desert', name: 'Пустыня', icon: '🏜️', skyTop: '#ff8c42', skyBot: '#ffd89b', roadColor: '#8a6d3b', roadEdge: '#c9a300', lineColor: '#fff59d', bgColor: '#d4a76a', decorColor: '#b8894a' },

        // ========== МАШИНЫ (НОВЫЕ ЦЕНЫ — все до 100) ==========
        const CARS = [

            { id: 'taxi',      name: 'Такси',      color: '#f9a826', price: 20,  icon: '🚕', perk: 'x2 монеты',       perkDesc: 'Монеты вдвое' },

            { id: 'minivan',   name: 'Минивэн',    color: '#16a085', price: 40,  icon: '🚐', perk: 'Широкий',         perkDesc: 'Больше, но медленнее' },
            { id: 'jeep',      name: 'Джип',       color: '#8b4513', price: 50,  icon: '🚙', perk: 'Неуязвим',        perkDesc: 'Сбивает врагов' },
            { id: 'formula',   name: 'Формула 1',  color: '#ff1744', price: 70,  icon: '🏎️', perk: 'Турбо',           perkDesc: 'Быстрее на 20%' },
            { id: 'race',      name: 'Гоночная',   color: '#9b59b6', price: 100, icon: '🏁', perk: 'Дрифт',           perkDesc: 'Резкие повороты' }
        ];

        const BONUS_PRICES = { shield: 5, slow: 3, x2: 5 };
        const TELEPORT_PRICE = 50;

        // ========== ДОСТИЖЕНИЯ ==========
        const ACHIEVEMENTS = [
            { id: 'first_coin',    name: 'Первая монета',    desc: 'Собери 1 монету',              icon: '🪙', reward: 5,   check: (s) => s.totalCoins >= 1 },
            { id: 'coins_50',      name: 'Копилка',          desc: 'Собери 50 монет',              icon: '💰', reward: 15,  check: (s) => s.totalCoins >= 50 },
            { id: 'coins_200',     name: 'Богач',            desc: 'Собери 200 монет',             icon: '💎', reward: 50,  check: (s) => s.totalCoins >= 200 },
            { id: 'score_1000',    name: 'Первая тысяча',    desc: 'Набери 1000 очков',            icon: '📈', reward: 10,  check: (s) => s.bestScore >= 1000 },
            { id: 'score_5000',    name: 'Гонщик',           desc: 'Набери 5000 очков',            icon: '🏎️', reward: 25,  check: (s) => s.bestScore >= 5000 },
            { id: 'score_10000',   name: 'Легенда',          desc: 'Набери 10000 очков',           icon: '⭐', reward: 50,  check: (s) => s.bestScore >= 10000 },

        function initAudio() {

        function playTone(freq, duration, type = 'sine', volume = 0.15, startTime = 0) {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(volume, audioCtx.currentTime + startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + startTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + startTime);
            osc.stop(audioCtx.currentTime + startTime + duration);
        }

        // 💥 НОВЫЙ ЗВУК АВАРИИ — удар + скрежет металла + стекло
        function soundCrash() {
            if (!soundEnabled || !audioCtx) return;

            // 1. Низкий удар (бас)
            const bassOsc = audioCtx.createOscillator();
            const bassGain = audioCtx.createGain();
            bassOsc.type = 'sine';
            bassOsc.frequency.setValueAtTime(120, audioCtx.currentTime);
            bassOsc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.5);
            bassGain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            bassGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
            bassOsc.connect(bassGain);
            bassGain.connect(audioCtx.destination);
            bassOsc.start();
            bassOsc.stop(audioCtx.currentTime + 0.6);

            // 2. Шум удара (металлический)
            const bufferSize = audioCtx.sampleRate * 0.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.value = 2000;
            noiseFilter.Q.value = 1.5;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noise.start();

            // 3. Скрежет металла (низкий sawtooth)
            const scrapeOsc = audioCtx.createOscillator();
            const scrapeGain = audioCtx.createGain();
            scrapeOsc.type = 'sawtooth';
            scrapeOsc.frequency.setValueAtTime(80, audioCtx.currentTime + 0.1);
            scrapeOsc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.5);
            scrapeGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
            scrapeGain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.1);
            scrapeGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
            scrapeOsc.connect(scrapeGain);
            scrapeGain.connect(audioCtx.destination);
            scrapeOsc.start(audioCtx.currentTime + 0.1);
            scrapeOsc.stop(audioCtx.currentTime + 0.6);

            // 4. Стекло (высокий короткий "дзынь")
            for (let i = 0; i < 5; i++) {
                playTone(3000 + Math.random() * 3000, 0.08, 'triangle', 0.08, 0.2 + Math.random() * 0.3);
            }
        }

        const MUSIC_NOTES = [
            440, 523, 659, 523, 440, 392, 440, 523,   // Фаза 1
            587, 659, 784, 659, 587, 523, 587, 659,   // Фаза 2

        function playMusicNote(index) {
            if (!soundEnabled || !audioCtx || !musicPlaying) return;
            const freq = MUSIC_NOTES[index % MUSIC_NOTES.length];
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);

            // Басовая нота (на каждой 4-й)
            if (index % 4 === 0) {
                const bassOsc = audioCtx.createOscillator();
                const bassGain = audioCtx.createGain();
                bassOsc.type = 'sine';
                bassOsc.frequency.value = freq / 4;
                bassGain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                bassGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                bassOsc.connect(bassGain);
                bassGain.connect(audioCtx.destination);
                bassOsc.start();
                bassOsc.stop(audioCtx.currentTime + 0.4);
            }
        }

        // ========== СПАВН (с 3D-координатами) ==========
        function spawnEnemy() {
            const x = 30 + Math.random() * (W - 60);
            const colors = ['#e94560', '#f9a826', '#9b59b6', '#3498db', '#e67e22'];
            const types = ['car', 'car', 'car', 'truck', 'moto'];
            enemies.push({
                x: x,
                y: 0,           // Y на дороге (глубина)
                color: colors[Math.floor(Math.random() * colors.length)],
                speed: currentLevel.enemySpeedMin + Math.random() * (currentLevel.enemySpeedMax - currentLevel.enemySpeedMin),
                type: types[Math.floor(Math.random() * types.length)]
            });
        }

        function spawnCoin() {
            const x = 30 + Math.random() * (W - 60);
            coins.push({ x: x, y: 0, phase: Math.random() * Math.PI * 2 });
        }

        function spawnObstacle() {
            const x = 40 + Math.random() * (W - 80);
            const types = ['cone', 'pit', 'puddle'];
            obstacles.push({ x: x, y: 0, type: types[Math.floor(Math.random() * types.length)] });
        }

        function spawnRoadBonus() {
            const x = 40 + Math.random() * (W - 80);
            const types = ['boost', 'magnet', 'shield'];
            roadBonuses.push({ x: x, y: 0, type: types[Math.floor(Math.random() * types.length)], phase: 0 });
        }

        // ========== ОБНОВЛЕНИЕ ==========
        function update() {
            if (gameOver || !currentLevel || pauseActive) return;

            // Движение игрока (X — по горизонтали)
            const playerSpeed = 5 * (1 + (upgrades.tires || 0) * 0.05);
            if (keys.left) player.x -= playerSpeed;
            if (keys.right) player.x += playerSpeed;
            player.x = Math.max(40, Math.min(W - 40, player.x));

            roadOffset = (roadOffset + speed) % 60;

            if (slowActive) { slowTimer -= 1; if (slowTimer <= 0) slowActive = false; }
            if (boostActive) { boostTimer -= 1; if (boostTimer <= 0) { boostActive = false; updateAbilities(); } }

            // Погода
            weatherTimer -= 1;
            if (weatherTimer <= 0) {
                const roll = Math.random();
                if (roll < 0.6) weather = 'clear';
                else if (roll < 0.75) weather = 'rain';
                else if (roll < 0.9) weather = 'snow';
                else weather = 'fog';
                weatherTimer = 600;
            }

            const boostFactor = boostActive ? 1.8 : 1;

            spawnTimer += speed * boostFactor;
            if (spawnTimer > currentLevel.spawnRate) { spawnEnemy(); spawnTimer = 0; }

            coinTimer -= 1;
            if (coinTimer <= 0) { spawnCoin(); coinTimer = 120 + Math.random() * 120; }

            obstacleTimer -= 1;
            if (obstacleTimer <= 0) { spawnObstacle(); obstacleTimer = 200 + Math.random() * 200; }

            roadBonusTimer -= 1;
            if (roadBonusTimer <= 0) { spawnRoadBonus(); roadBonusTimer = 400 + Math.random() * 300; }

            // Враги (Y — глубина, увеличивается)
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].y += (speed + enemies[i].speed) * boostFactor;

                // Столкновение: если враг на глубине 0.8–1.0 и по X близко к игроку
                if (enemies[i].y > 0.8 && enemies[i].y < 1.05) {
                    const dx = Math.abs(enemies[i].x - player.x);
                    if (dx < 40) {
                        const car = getCarById(equippedCar);
                        if (shieldActive) {
                            enemies.splice(i, 1); shieldActive = false;
                            playTone(200, 0.3, 'sawtooth', 0.15, 0);
                            updateAbilities();
                            continue;
                        }
                        if (car.id === 'jeep' || car.id === 'fire') {
                            enemies.splice(i, 1); score += 20; soundPoint();
                            continue;
                        }
                        if (car.id === 'ambulance' && !ambulanceUsed) {
                            enemies.splice(i, 1); ambulanceUsed = true;
                            playTone(400, 0.3, 'sine', 0.15, 0);
                            continue;
                        }
                        crashGame();
                        return;
                    }
                }

                if (enemies[i] && enemies[i].y > 1.2) {
                    enemies.splice(i, 1);
                    score += 10 * scoreMultiplier;
                    scoreEl.textContent = Math.floor(score);
                    soundPoint();
                }
            }

            // Монеты
            const car = getCarById(equippedCar);
            const coinMultiplier = (car.id === 'taxi' ? 2 : 1) * coinBonusMultiplier;
            for (let i = coins.length - 1; i >= 0; i--) {
                coins[i].y += speed * boostFactor;
                coins[i].phase += 0.15;
                if (coins[i].y > 0.8 && coins[i].y < 1.05) {
                    const dx = Math.abs(coins[i].x - player.x);
                    if (dx < 45 * magnetRange) {
                        coins.splice(i, 1);
                        wallet += coinMultiplier;
                        coinsCollected += 1;
                        totalCoins += 1;
                        savePlayer(); updateWalletUI(); soundCoin();
                        continue;
                    }
                }
                if (coins[i].y > 1.2) coins.splice(i, 1);
            }

            // Препятствия
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += speed * boostFactor;
                if (obstacles[i].y > 0.8 && obstacles[i].y < 1.05) {
                    const dx = Math.abs(obstacles[i].x - player.x);
                    if (dx < 35) {
                        if (obstacles[i].type === 'puddle') {
                            speed = Math.max(currentLevel.startSpeed, speed - 0.1);
                            obstacles.splice(i, 1);
                            continue;
                        }
                        if (shieldActive) {
                            obstacles.splice(i, 1); shieldActive = false;
                            updateAbilities();
                            continue;
                        }
                        if (car.id === 'jeep') {
                            obstacles.splice(i, 1);
                            continue;
                        }
                        crashGame();
                        return;
                    }
                }
                if (obstacles[i] && obstacles[i].y > 1.2) obstacles.splice(i, 1);
            }

            // Бонусы на дороге
            for (let i = roadBonuses.length - 1; i >= 0; i--) {
                roadBonuses[i].y += speed * boostFactor;
                roadBonuses[i].phase += 0.15;
                if (roadBonuses[i].y > 0.8 && roadBonuses[i].y < 1.05) {
                    const dx = Math.abs(roadBonuses[i].x - player.x);
                    if (dx < 45) {
                        const type = roadBonuses[i].type;
                        if (type === 'boost') { boostActive = true; boostTimer = 120; soundBoost(); }
                        else if (type === 'magnet') {
                            magnetRange = 3;
                            setTimeout(() => { magnetRange = 1 + (upgrades.magnet || 0) * 0.1; }, 5000);
                            soundCoin();
                        }
                        else if (type === 'shield') { shieldActive = true; soundPurchase(); updateAbilities(); }
                        roadBonuses.splice(i, 1);
                        continue;
                    }
                }
                if (roadBonuses[i] && roadBonuses[i].y > 1.2) roadBonuses.splice(i, 1);
            }

            // Скорость и очки
            speed += currentLevel.speedRamp;
            const oldScore = Math.floor(score / 1000);
            score += speed * 0.05 * scoreMultiplier;
            const newScore = Math.floor(score / 1000);
            if (newScore > oldScore) { wallet += 10; savePlayer(); updateWalletUI(); }
            scoreEl.textContent = Math.floor(score);
            updateEngine();

            // 🎉 ПОЗДРАВЛЕНИЯ каждые 500 м (очков)
            const currentMeters = Math.floor(score / 500) * 500;
            if (currentMeters > milestone && currentMeters >= 500) {
                milestone = currentMeters;
                congratsText = `🎉 ${currentMeters} М!`;
                congratsTimer = 180;
                wallet += 10;
                score += 100;
                savePlayer(); updateWalletUI();
                soundCongrats();
            }
            if (congratsTimer > 0) congratsTimer -= 1;
        }

        function crashGame() {
            gameOver = true;
            stopEngine();
            stopMusic();
            soundCrash();

            totalGames += 1;
            const finalScore = Math.floor(score);
            if (finalScore > bestScore) bestScore = finalScore;
            if (finalScore > best) { best = finalScore; localStorage.setItem('r3_best', best); }
            if (!playedMaps.includes(selectedMap)) playedMaps.push(selectedMap);

            dailyData.tasks.forEach(t => {
                if (t.done) return;
                if (t.id === 'd_coins') t.progress += coinsCollected;
                if (t.id === 'd_score') t.progress = Math.max(t.progress, finalScore);
                if (t.id === 'd_games') t.progress += 1;
                if (t.progress >= t.goal) t.done = true;
            });

            if (currentCampaignLevel) {
                const done = currentCampaignLevel.type === 'coins'
                    ? coinsCollected >= currentCampaignLevel.goal
                    : finalScore >= currentCampaignLevel.goal;
                if (done && campaignProgress < currentCampaignLevel.id) {
                    campaignProgress = currentCampaignLevel.id;
                    wallet += currentCampaignLevel.reward;
                    soundAchievement();
                }
            }

            playerXP += Math.floor(finalScore / 100);
            updatePlayerLevel();

            checkAchievements();
            savePlayer();
            updateWalletUI();

            showGameOver();
        }
                    // ========== ОТРИСОВКА ==========
        function roundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function shadeColor(color, percent) {
            if (color.startsWith('rgba') || color === '#ffffff' || color === '#fff') return color;
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.max(0, Math.min(255, (num >> 16) + amt));
            const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
            const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
            return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }

        // ========== 3D-ПРОЕКЦИЯ ==========
        // y = 0 → далеко (у горизонта), y = 1 → близко (внизу)
        const HORIZON_Y = 180;      // где горизонт на канвасе
        const ROAD_TOP_W = 60;      // ширина дороги у горизонта
        const ROAD_BOT_W = 320;     // ширина дороги внизу

        function projectY(y) {
            // y от 0 до 1 → экранный Y от HORIZON_Y до H
            return HORIZON_Y + y * (H - HORIZON_Y);
        }

        function projectRoadWidth(y) {
            // ширина дороги на глубине y
            return ROAD_TOP_W + y * (ROAD_BOT_W - ROAD_TOP_W);
        }

        function projectX(worldX, y) {
            // worldX от 0 до W (мировые координаты) → экранный X
            const roadW = projectRoadWidth(y);
            const centerX = W / 2;
            const offset = (worldX - W / 2) / W;   // -0.5 .. 0.5
            return centerX + offset * roadW;
        }

        function projectScale(y) {
            // масштаб объекта на глубине y
            return 0.15 + y * 0.85;
        }

        // ========== ОТРИСОВКА МАШИНЫ 3D ==========
        function drawCar3D(worldX, depthY, color, isPlayer, carType) {
            if (depthY < 0 || depthY > 1.05) return;

            const screenX = projectX(worldX, depthY);
            const screenY = projectY(depthY);
            const scale = projectScale(depthY);

            const w = playerW * scale;
            const h = playerH * scale;

            // Пропускаем, если слишком далеко/маленький
            if (w < 4) return;

            // Тень
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            roundRect(screenX - w / 2 + 3, screenY - h + 4, w, h, 6 * scale);
            ctx.fill();

            // Колёса
            ctx.fillStyle = '#1a1a1a';
            const wheelW = 5 * scale, wheelH = 12 * scale;
            roundRect(screenX - w / 2 - wheelW / 2, screenY - h + h * 0.2, wheelW, wheelH, 2 * scale); ctx.fill();
            roundRect(screenX + w / 2 - wheelW / 2, screenY - h + h * 0.2, wheelW, wheelH, 2 * scale); ctx.fill();
            roundRect(screenX - w / 2 - wheelW / 2, screenY - h * 0.35, wheelW, wheelH, 2 * scale); ctx.fill();
            roundRect(screenX + w / 2 - wheelW / 2, screenY - h * 0.35, wheelW, wheelH, 2 * scale); ctx.fill();

            // Корпус
            const grad = ctx.createLinearGradient(screenX - w / 2, 0, screenX + w / 2, 0);
            grad.addColorStop(0, shadeColor(color, -30));
            grad.addColorStop(0.5, color);
            grad.addColorStop(1, shadeColor(color, -30));
            ctx.fillStyle = grad;
            roundRect(screenX - w / 2, screenY - h, w, h, 6 * scale);
            ctx.fill();

            // Заднее стекло
            ctx.fillStyle = 'rgba(120,200,255,0.6)';
            roundRect(screenX - w / 2 + 3 * scale, screenY - h + 4 * scale, w - 6 * scale, h * 0.25, 3 * scale);
            ctx.fill();

            // Фары задние (у игрока — красные, у врагов — видны)
            if (isPlayer) {
                ctx.fillStyle = '#ff1744';
                roundRect(screenX - w / 2 + 2 * scale, screenY - 6 * scale, 8 * scale, 4 * scale, 1 * scale); ctx.fill();
                roundRect(screenX + w / 2 - 10 * scale, screenY - 6 * scale, 8 * scale, 4 * scale, 1 * scale); ctx.fill();

                // Свечение
                const glow = ctx.createRadialGradient(screenX - w / 2 + 6 * scale, screenY - 4 * scale, 0, screenX - w / 2 + 6 * scale, screenY - 4 * scale, 20 * scale);
                glow.addColorStop(0, 'rgba(255, 23, 68, 0.4)');
                glow.addColorStop(1, 'rgba(255, 23, 68, 0)');
                ctx.fillStyle = glow;
                ctx.fillRect(screenX - w / 2 - 20 * scale, screenY - 20 * scale, 40 * scale, 40 * scale);

                const glow2 = ctx.createRadialGradient(screenX + w / 2 - 6 * scale, screenY - 4 * scale, 0, screenX + w / 2 - 6 * scale, screenY - 4 * scale, 20 * scale);
                glow2.addColorStop(0, 'rgba(255, 23, 68, 0.4)');
                glow2.addColorStop(1, 'rgba(255, 23, 68, 0)');
                ctx.fillStyle = glow2;
                ctx.fillRect(screenX + w / 2 - 20 * scale, screenY - 20 * scale, 40 * scale, 40 * scale);

                // Полицейская мигалка
                if (carPerk === 'Сирена') {
                    const flash = Math.floor(Date.now() / 200) % 2;
                    ctx.fillStyle = flash === 0 ? '#ff1744' : '#2979ff';
                    roundRect(screenX - 6 * scale, screenY - h - 4 * scale, 12 * scale, 4 * scale, 2 * scale);
                    ctx.fill();
                }
            } else {
                // У врагов — фары спереди (видны как маленькие точки)
                ctx.fillStyle = '#ff5252';
                roundRect(screenX - w / 2 + 2 * scale, screenY - h + 2 * scale, 5 * scale, 3 * scale, 1 * scale); ctx.fill();
                roundRect(screenX + w / 2 - 7 * scale, screenY - h + 2 * scale, 5 * scale, 3 * scale, 1 * scale); ctx.fill();
            }

            // Щит
            if (isPlayer && shieldActive) {
                const shieldGrad = ctx.createRadialGradient(screenX, screenY - h / 2, 0, screenX, screenY - h / 2, w);
                shieldGrad.addColorStop(0, 'rgba(78, 204, 255, 0.05)');
                shieldGrad.addColorStop(0.7, 'rgba(78, 204, 255, 0.25)');
                shieldGrad.addColorStop(1, 'rgba(78, 204, 255, 0)');
                ctx.fillStyle = shieldGrad;
                ctx.beginPath();
                ctx.arc(screenX, screenY - h / 2, w, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawCoin3D(coin) {
            const depthY = coin.y;
            if (depthY < 0 || depthY > 1.05) return;

            const screenX = projectX(coin.x, depthY);
            const screenY = projectY(depthY);
            const scale = projectScale(depthY);
            const wobble = Math.sin(coin.phase) * 0.3 + 1;
            const r = coinR * scale * wobble;

            if (r < 2) return;

            // Свечение
            const glow = ctx.createRadialGradient(screenX, screenY, 0, screenX, screenY, r * 2);
            glow.addColorStop(0, 'rgba(255,215,0,0.5)');
            glow.addColorStop(1, 'rgba(255,215,0,0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(screenX, screenY, r * 2, 0, Math.PI * 2);
            ctx.fill();

            // Монетка
            const grad = ctx.createRadialGradient(screenX - r * 0.3, screenY - r * 0.3, 0, screenX, screenY, r);
            grad.addColorStop(0, '#fff59d');
            grad.addColorStop(0.7, '#ffd700');
            grad.addColorStop(1, '#c9a300');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(screenX, screenY, r, 0, Math.PI * 2);
            ctx.fill();

            if (r > 6) {
                ctx.strokeStyle = '#8a6d00';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.fillStyle = '#8a6d00';
                ctx.font = `bold ${Math.floor(12 * scale)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('$', screenX, screenY + 1);
            }
        }

        function drawObstacle3D(o) {
            const depthY = o.y;
            if (depthY < 0 || depthY > 1.05) return;

            const screenX = projectX(o.x, depthY);
            const screenY = projectY(depthY);
            const scale = projectScale(depthY);

            const w = 30 * scale;
            const h = 30 * scale;

            if (w < 3) return;

            if (o.type === 'cone') {
                ctx.fillStyle = '#ff6b00';
                ctx.beginPath();
                ctx.moveTo(screenX, screenY - h);
                ctx.lineTo(screenX + w / 2, screenY);
                ctx.lineTo(screenX - w / 2, screenY);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.fillRect(screenX - w / 4, screenY - h / 2, w / 2, 3 * scale);
            } else if (o.type === 'pit') {
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.ellipse(screenX, screenY, w / 2, h / 3, 0, 0, Math.PI * 2);
                ctx.fill();
            } else if (o.type === 'puddle') {
                ctx.fillStyle = 'rgba(50, 100, 200, 0.6)';
                ctx.beginPath();
                ctx.ellipse(screenX, screenY, w / 2, h / 3, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawRoadBonus3D(b) {
            const depthY = b.y;
            if (depthY < 0 || depthY > 1.05) return;

            const screenX = projectX(b.x, depthY);
            const screenY = projectY(depthY);
            const scale = projectScale(depthY);
            const wobble = Math.sin(b.phase) * 0.3 + 1;
            const r = 18 * scale * wobble;

            if (r < 3) return;

            const icons = { boost: '⚡', magnet: '🧲', shield: '🛡️' };
            const colors = { boost: '#00d2ff', magnet: '#e67e22', shield: '#4ecca3' };

            // Свечение
            const glow = ctx.createRadialGradient(screenX, screenY, 0, screenX, screenY, r * 2);
            glow.addColorStop(0, colors[b.type] + '80');
            glow.addColorStop(1, colors[b.type] + '00');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(screenX, screenY, r * 2, 0, Math.PI * 2);
            ctx.fill();

            // Круг
            ctx.fillStyle = colors[b.type];
            ctx.beginPath();
            ctx.arc(screenX, screenY, r, 0, Math.PI * 2);
            ctx.fill();

            // Иконка
            if (r > 8) {
                ctx.fillStyle = '#fff';
                ctx.font = `bold ${Math.floor(20 * scale)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(icons[b.type], screenX, screenY + 1);
            }
        }

        // ========== ОТРИСОВКА ДОРОГИ ==========
        function drawRoad3D() {
            // Небо
            const skyGrad = ctx.createLinearGradient(0, 0, 0, HORIZON_Y);
            skyGrad.addColorStop(0, currentMap.skyTop);
            skyGrad.addColorStop(1, currentMap.skyBot);
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, W, HORIZON_Y);

            // Земля (обочины)
            ctx.fillStyle = currentMap.decorColor;
            ctx.fillRect(0, HORIZON_Y, W, H - HORIZON_Y);

            // Дорога (трапеция)
            const roadTopLeft = W / 2 - ROAD_TOP_W / 2;
            const roadTopRight = W / 2 + ROAD_TOP_W / 2;
            const roadBotLeft = W / 2 - ROAD_BOT_W / 2;
            const roadBotRight = W / 2 + ROAD_BOT_W / 2;

            ctx.fillStyle = currentMap.roadColor;
            ctx.beginPath();
            ctx.moveTo(roadTopLeft, HORIZON_Y);
            ctx.lineTo(roadTopRight, HORIZON_Y);
            ctx.lineTo(roadBotRight, H);
            ctx.lineTo(roadBotLeft, H);
            ctx.closePath();
            ctx.fill();

            // Края дороги
            ctx.strokeStyle = currentMap.roadEdge;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(roadTopLeft, HORIZON_Y);
            ctx.lineTo(roadBotLeft, H);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(roadTopRight, HORIZON_Y);
            ctx.lineTo(roadBotRight, H);
            ctx.stroke();

            // Разметка (полосы, уходящие вдаль)
            ctx.fillStyle = currentMap.lineColor;
            const stripeCount = 8;
            for (let i = 0; i < stripeCount; i++) {
                const baseY = (i * 60 + roadOffset) / (H - HORIZON_Y);
                for (let s = 0; s < 3; s++) {
                    const y1 = (baseY + s * 0.3) % 1;
                    const y2 = Math.min(1, y1 + 0.1);
                    if (y1 >= 1) continue;

                    const sy1 = HORIZON_Y + y1 * (H - HORIZON_Y);
                    const sy2 = HORIZON_Y + y2 * (H - HORIZON_Y);
                    const w1 = (ROAD_TOP_W + y1 * (ROAD_BOT_W - ROAD_TOP_W)) * 0.02;
                    const w2 = (ROAD_TOP_W + y2 * (ROAD_BOT_W - ROAD_TOP_W)) * 0.02;

                    ctx.beginPath();
                    ctx.moveTo(W / 2 - w1, sy1);
                    ctx.lineTo(W / 2 + w1, sy1);
                    ctx.lineTo(W / 2 + w2, sy2);
                    ctx.lineTo(W / 2 - w2, sy2);
                    ctx.closePath();
                    ctx.fill();
                }
            }
        }

        // ========== ПОГОДА ==========
        function drawWeather() {
            if (weather === 'rain') {
                ctx.strokeStyle = 'rgba(150, 200, 255, 0.5)';
                ctx.lineWidth = 1;
                for (let i = 0; i < 60; i++) {
                    const x = (i * 37 + Date.now() * 0.3) % W;
                    const y = (i * 53 + Date.now() * 0.5) % H;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x - 2, y + 12);
                    ctx.stroke();
                }
            } else if (weather === 'snow') {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                for (let i = 0; i < 40; i++) {
                    const x = (i * 41 + Math.sin(Date.now() * 0.001 + i) * 25) % W;
                    const y = (i * 67 + Date.now() * 0.15) % H;
                    ctx.beginPath();
                    ctx.arc(x, y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (weather === 'fog') {
                const grad = ctx.createLinearGradient(0, HORIZON_Y - 50, 0, H);
                grad.addColorStop(0, 'rgba(200, 200, 220, 0.5)');
                grad.addColorStop(0.5, 'rgba(200, 200, 220, 0.2)');
                grad.addColorStop(1, 'rgba(200, 200, 220, 0.1)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
            }
        }

        // ========== ПОЗДРАВЛЕНИЯ ==========
        function drawCongrats() {
            if (congratsTimer <= 0) return;

            const alpha = Math.min(1, congratsTimer / 60);
            ctx.save();
            ctx.globalAlpha = alpha;

            // Баннер
            const bannerW = 300;
            const bannerH = 80;
            const bx = (W - bannerW) / 2;
            const by = H / 2 - bannerH / 2;

            const grad = ctx.createLinearGradient(bx, by, bx, by + bannerH);
            grad.addColorStop(0, 'rgba(255, 215, 0, 0.95)');
            grad.addColorStop(1, 'rgba(255, 140, 0, 0.95)');
            ctx.fillStyle = grad;
            roundRect(bx, by, bannerW, bannerH, 16);
            ctx.fill();

            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            roundRect(bx, by, bannerW, bannerH, 16);
            ctx.stroke();

            // Текст
            ctx.fillStyle = '#1a1a2e';
            ctx.font = 'bold 32px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(congratsText, W / 2, H / 2 - 10);

            ctx.font = 'bold 16px sans-serif';
            ctx.fillStyle = '#1a1a2e';
            ctx.fillText('+10 🪙  +100 очков', W / 2, H / 2 + 22);

            ctx.restore();
        }

        // ========== ГЛАВНАЯ ОТРИСОВКА ==========
        function draw() {
            if (!currentLevel || !currentMap) return;

            // Дорога (3D)
            drawRoad3D();

            // Объекты (по глубине — сначала далёкие, потом близкие)
            const allObjects = [
                ...coins.map(c => ({ type: 'coin', obj: c, y: c.y })),
                ...roadBonuses.map(b => ({ type: 'bonus', obj: b, y: b.y })),
                ...obstacles.map(o => ({ type: 'obstacle', obj: o, y: o.y })),
                ...enemies.map(e => ({ type: 'enemy', obj: e, y: e.y }))
            ];
            allObjects.sort((a, b) => a.y - b.y);

            allObjects.forEach(item => {
                if (item.type === 'coin') drawCoin3D(item.obj);
                else if (item.type === 'bonus') drawRoadBonus3D(item.obj);
                else if (item.type === 'obstacle') drawObstacle3D(item.obj);
                else if (item.type === 'enemy') {
                    let w = enemyW, h = enemyH;
                    if (item.obj.type === 'truck') { w = enemyW + 20; h = enemyH + 20; }
                    else if (item.obj.type === 'moto') { w = enemyW - 14; h = enemyH - 10; }
                    drawCar3D(item.obj.x, item.obj.y, item.obj.color, false, item.obj.type);
                }
            });

            // Игрок (всегда поверх)
            const myCar = getCarById(equippedCar);
            drawCar3D(player.x, 0.95, myCar.color, true, 'player');

            // Погода
            drawWeather();

            // Поздравление
            drawCongrats();

            // Пауза
            if (pauseActive) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 36px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('ПАУЗА', W / 2, H / 2);
                ctx.font = '16px sans-serif';
                ctx.fillStyle = '#aaa';
                ctx.fillText('Нажми П чтобы продолжить', W / 2, H / 2 + 40);
            }

            // Game over
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#e94560';
                ctx.font = 'bold 42px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'alphabetic';
                ctx.fillText('АВАРИЯ!', W / 2, H / 2 - 80);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 26px sans-serif';
                ctx.fillText('Очки: ' + Math.floor(score), W / 2, H / 2 - 30);
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText('🪙 Собрано: ' + coinsCollected, W / 2, H / 2 + 5);
                ctx.fillStyle = '#4ecca3';
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText('💰 В копилке: ' + wallet, W / 2, H / 2 + 35);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
                    // ========== УПРАВЛЕНИЕ ==========
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'arrowleft' || key === 'a' || key === 'ф') keys && (keys.left = true);
            if (key === 'arrowright' || key === 'd' || key === 'в') keys && (keys.right = true);
            if (key === ' ' && gameOver && currentLevel) {
                startGame(Object.keys(LEVELS).find(k => LEVELS[k] === currentLevel));
            }
            if ((key === 'm' || key === 'ь') && gameOver) showMainMenu();
            if (key === 'у' || key === 'e') activateBoost();
            if (key === 'щ' || key === 'o') activateShield();
            if (key === 'т' || key === 'n') activateTeleport();
            if (key === 'п' || key === 'g') togglePause();
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'arrowleft' || key === 'a' || key === 'ф') keys && (keys.left = false);
            if (key === 'arrowright' || key === 'd' || key === 'в') keys && (keys.right = false);
        });

        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        function bindBtn(btn, dir) {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); if (keys) keys[dir] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); if (keys) keys[dir] = false; });
            btn.addEventListener('mousedown', () => keys && (keys[dir] = true));
            btn.addEventListener('mouseup', () => keys && (keys[dir] = false));
            btn.addEventListener('mouseleave', () => keys && (keys[dir] = false));
        }
        bindBtn(leftBtn, 'left');
        bindBtn(rightBtn, 'right');

        document.querySelectorAll('.menu-btn[data-level]').forEach(btn => {
            btn.addEventListener('click', () => startGame(btn.dataset.level));
        });

        // ========== СТАРТ ==========
        applyUpgrades();
        updateWalletUI();
        updateTeleportBtn();
        updatePlayerStats();
        renderMaps();
        document.getElementById('achCount').textContent = `${unlockedAchievements.length}/${ACHIEVEMENTS.length}`;
        showMainMenu();
        loop();
    </script>
